<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patio Boys — Free Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F131B; --surface:#171D28; --surface-2:#1F2735;
    --ink:#ECEEF3; --ink-dim:#8B93A6; --hairline:#2E3645;
    --gold:#E8C34A; --coral:#D8553A; --green:#1D9E75;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.45}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 48px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0;border-bottom:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px}
  .topbar .brand .gm{font-family:'Anton',sans-serif;font-size:18px;color:var(--ink);letter-spacing:.04em}
  .topbar .brand .gm em{color:var(--gold);font-style:normal}
  body.embed .topbar{padding:10px 0}

  .status{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:16px 0 0;
  }
  .status.error{color:var(--coral)}

  .controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    margin:16px 0 12px;padding-bottom:14px;border-bottom:1px solid var(--hairline);
  }
  .field{display:flex;flex-direction:column;gap:5px;min-width:140px}
  .field label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.08em;text-transform:uppercase;
  }
  .field select,.field input{
    background:var(--surface);border:1px solid var(--hairline);border-radius:6px;
    color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;
  }
  .field input{min-width:180px}
  .field select:focus,.field input:focus{outline:2px solid var(--gold);outline-offset:1px}

  .team-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .team-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--hairline);border-radius:6px;
    color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;
    font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:8px 12px;cursor:pointer;
  }
  .team-chip .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  .team-chip:hover{color:var(--ink);border-color:var(--ink-dim)}
  .team-chip.active{
    color:var(--ink);border-color:var(--chip-color,var(--gold));
    background:color-mix(in srgb, var(--chip-color,var(--gold)) 14%, var(--surface));
  }

  .report-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:4px 0 12px;
  }
  .report-head h1{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;margin:0;letter-spacing:.03em;
  }
  .report-head p{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;margin:0;
  }

  .fit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
  .fit-card{
    border:1px solid var(--hairline);border-radius:8px;padding:12px 14px;background:var(--surface);
    border-left:4px solid var(--team-color, var(--gold));
  }
  .fit-card .rank{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;
  }
  .fit-card .name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0;line-height:1}
  .fit-card .meta{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);margin:6px 0 0;line-height:1.5;
  }
  .fit-card .gain{color:var(--gold);font-weight:600}
  .fit-card .why{font-size:13px;color:#C9CDD8;margin:8px 0 0;line-height:1.4}

  .board{
    border:1px solid var(--hairline);border-radius:8px;overflow:hidden;background:var(--surface);
  }
  table{width:100%;border-collapse:collapse}
  th,td{
    text-align:left;padding:9px 12px;
    border-bottom:1px solid color-mix(in srgb, var(--hairline) 80%, transparent);
    font-size:13px;vertical-align:top;
  }
  th{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);
  }
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--ink)}
  th.sortable[aria-sort="ascending"],
  th.sortable[aria-sort="descending"]{color:var(--gold)}
  td.rk{font-family:'Anton',sans-serif;font-size:16px;color:var(--ink-dim);width:40px}
  td.player{font-weight:600}
  td.player .sub{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
    color:var(--ink-dim);margin-top:2px;
  }
  td.num{
    font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--gold);
  }
  td.lock .ovr{
    font-family:'Anton',sans-serif;font-size:16px;line-height:1;color:var(--gold);
  }
  td.lock .tier-sub{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);margin-top:2px;
  }
  td.trade .trade-stars{
    display:inline-flex;align-items:center;gap:1px;
    font-size:14px;letter-spacing:0;color:var(--gold);white-space:nowrap;
    line-height:1;height:1em;vertical-align:middle;
  }
  td.trade .trade-stars .star{
    display:inline-flex;align-items:center;justify-content:flex-start;
    width:.9em;height:1em;line-height:1;font-size:1em;
    overflow:hidden;flex:0 0 auto;
  }
  td.trade .trade-stars .star.half{width:.45em}
  td.fit{font-size:12px;color:#C9CDD8}
  td.fit .slot{color:var(--green)}
  tr.mine td{background:color-mix(in srgb, var(--gold) 7%, transparent)}
  tr:last-child td{border-bottom:none}
  .empty{
    padding:28px;text-align:center;color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;
  }
  .tag{
    display:inline-block;margin-left:6px;padding:1px 5px;border-radius:3px;
    background:color-mix(in srgb, var(--gold) 22%, transparent);color:var(--gold);
    font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;vertical-align:2px;
  }
  .tag.young{background:color-mix(in srgb, var(--green) 22%, transparent);color:var(--green)}
  @media(max-width:720px){
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');</script>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="gm">Free <em>Agents</em></span><span>Patio Boys &middot; S26&ndash;27</span></div>
    <span id="progressTag">Loading&hellip;</span>
  </div>
  <p class="status" id="status">Pulling Sleeper waivers, projections, and team lineups&hellip;</p>

  <div id="app" hidden>
    <div class="controls">
      <div class="field">
        <label for="posFilter">Position</label>
        <select id="posFilter">
          <option value="ALL">All</option>
          <option value="PG">PG</option>
          <option value="SG">SG</option>
          <option value="SF">SF</option>
          <option value="PF">PF</option>
          <option value="C">C</option>
          <option value="G">G (PG/SG)</option>
          <option value="F">F (SF/PF)</option>
        </select>
      </div>
      <div class="field">
        <label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="fit">Best fit for team</option>
          <option value="proj">Projected FP/G</option>
          <option value="lock">Lock OVR</option>
          <option value="trade">Trade ★</option>
          <option value="age">Youngest</option>
          <option value="ovr">2K OVR</option>
        </select>
      </div>
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Name or team" autocomplete="off">
      </div>
    </div>

    <div class="team-nav" id="teamNav"></div>

    <div class="report-head">
      <h1 id="teamTitle">Targets</h1>
      <p id="teamSub">Lineup lift vs current roster</p>
    </div>
    <div class="fit-grid" id="fitGrid"></div>

    <div class="board">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th data-sort="name" data-label="Player">Player</th>
            <th data-sort="metric" data-label="Proj">Proj</th>
            <th data-sort="lockOvr" data-label="Lock">Lock</th>
            <th data-sort="tradeScore" data-label="Trade ★">Trade ★</th>
            <th class="hide-sm" data-sort="age" data-label="Age">Age</th>
            <th class="hide-sm" data-sort="ovr" data-label="2K">2K</th>
            <th data-sort="gain" data-label="Lineup lift">Lineup lift</th>
            <th data-sort="fitLabel" data-label="Fit">Fit</th>
          </tr>
        </thead>
        <tbody id="faBody"></tbody>
      </table>
      <div class="empty" id="faEmpty" hidden>No free agents match those filters.</div>
    </div>
  </div>
</div>

<script>
(function(){
  var v = new URLSearchParams(location.search).get('nocache') || '20260804-th-sort';
  ['2k-ratings-snapshot.js','nba-proj-consensus.js','team-needs.js','lock-in-dist.js','table-sort.js'].forEach(function(src){
    document.write('<script src="'+src+'?v='+encodeURIComponent(v)+'"><\/script>');
  });
})();
</script>
<script>
const LEAGUE_ID = '1350649177381552128';
const MY_TEAM = 'Freakonomics';
const TEAM_COLORS = {
  'Funeral Home':'#C9963A','BoobieDominguez':'#1D9E75','2011-12 Champs':'#D8553A',
  'Freakonomics':'#7F77DD','Papa Book':'#D4537E','Bam Add the Mayo':'#3A8FC9',
  'Hamas':'#9B59B6','Belt':'#5DBB63'
};
const TEAM_ALIASES = {
  '20112012champs':'2011-12 Champs',
  '20112012champ':'2011-12 Champs',
  'thehitmanharts':'BoobieDominguez',
  'badgersretirementhome':'Funeral Home',
  'belt':'Belt'
};

const TWO_K = window.TWO_K_SNAPSHOT || {rookies:[], ratings:[]};
const RATINGS_BY_NAME = new Map((TWO_K.ratings || []).map(p => [normalizeName(p.name), p]));
const ROOKIE_NAMES = new Set((TWO_K.rookies || []).map(p => normalizeName(p.name)));

function normalizeName(name){
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[.\u2019']/g, '').replace(/[^a-z0-9]/g, '');
}
function canonicalTeam(name){
  const norm = normalizeName(name);
  if (TEAM_ALIASES[norm]) return TEAM_ALIASES[norm];
  return Object.keys(TEAM_COLORS).find(k => normalizeName(k) === norm) || name;
}
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function playerName(p){
  if (!p) return 'Unknown';
  if (p.full_name) return p.full_name;
  return ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || 'Unknown';
}
function posLabel(poss){
  return (poss || []).filter(Boolean).join('/') || '\u2014';
}
function matchesPosFilter(poss, filter){
  if (!filter || filter === 'ALL') return true;
  const set = new Set((poss || []).map(String));
  if (filter === 'G') return set.has('PG') || set.has('SG') || set.has('G');
  if (filter === 'F') return set.has('SF') || set.has('PF') || set.has('F');
  return set.has(filter);
}

const state = {
  teams: [],
  agents: [],
  slots: [],
  selectedTeam: MY_TEAM,
  scoredByTeam: {},
  tableSort: {key: 'gain', dir: 'desc'}
};

const SORT_SELECT_TO_KEY = {
  fit: 'gain',
  proj: 'metric',
  lock: 'lockOvr',
  trade: 'tradeScore',
  age: 'age',
  ovr: 'ovr'
};
const SORT_KEY_TO_SELECT = {
  gain: 'fit',
  metric: 'proj',
  lockOvr: 'lock',
  tradeScore: 'trade',
  age: 'age',
  ovr: 'ovr'
};

function syncSortSelectFromState(){
  const sel = document.getElementById('sortBy');
  if (!sel) return;
  const mapped = SORT_KEY_TO_SELECT[state.tableSort.key];
  if (mapped) sel.value = mapped;
}

function applySortSelectToState(){
  const sel = document.getElementById('sortBy');
  if (!sel) return;
  const key = SORT_SELECT_TO_KEY[sel.value] || 'gain';
  const dir = (window.TableSort && TableSort.defaultDirForKey(key)) || (key === 'age' ? 'asc' : 'desc');
  state.tableSort = {key, dir};
}

function makeRecord(pid, playerDb, projById, lockDist){
  const p = playerDb[pid] || {};
  const name = playerName(p);
  const hit = RATINGS_BY_NAME.get(normalizeName(name));
  const positions = p.fantasy_positions || [p.position].filter(Boolean);
  const lock = lockDist && (lockDist[pid] || lockDist[String(pid)]) || null;
  return {
    id: String(pid),
    name,
    positions,
    pos: posLabel(positions),
    metric: projById.get(String(pid)) ?? null,
    age: p.age ?? null,
    nbaTeam: p.team || 'FA',
    injuryStatus: p.injury_status || null,
    ovr: hit && hit.ovr != null ? hit.ovr : null,
    yearsExp: p.years_exp ?? null,
    isRookie: ROOKIE_NAMES.has(normalizeName(name)) || Number(p.years_exp) === 0,
    lockOvr: lock && lock.lockOvr != null ? lock.lockOvr : null,
    lockTier: lock && lock.lockTierLabel ? lock.lockTierLabel : null,
    tradeScore: lock && lock.tradeScore != null ? lock.tradeScore : null,
    tradeStars: lock && lock.tradeStars != null ? lock.tradeStars : null
  };
}

function tradeStarsHtml(n){
  if (window.LockInDist && typeof LockInDist.formatStarsHtml === 'function'){
    return LockInDist.formatStarsHtml(n, {className: 'trade-stars'});
  }
  if (n == null || !Number.isFinite(Number(n))) return '<span class="trade-stars">—</span>';
  return '<span class="trade-stars">' + '★'.repeat(Math.max(1, Math.min(5, Math.round(Number(n))))) + '</span>';
}

function lockCellHtml(a){
  if (a.lockOvr == null) return '<td class="num lock">—</td>';
  const title = a.tradeScore != null
    ? ('Lock OVR ' + a.lockOvr + (a.lockTier ? ' · ' + a.lockTier : '')
      + ' · trade score ' + Number(a.tradeScore).toFixed(1))
    : ('Lock OVR ' + a.lockOvr);
  return '<td class="lock" title="' + escapeHtml(title) + '">'
    + '<span class="ovr">' + Math.round(a.lockOvr) + '</span>'
    + (a.lockTier ? '<span class="tier-sub">' + escapeHtml(a.lockTier) + '</span>' : '')
    + '</td>';
}

function scoreAgentsForTeam(team){
  if (!window.TeamNeedsModel || !state.slots.length){
    return state.agents.map(a => ({
      ...a,
      gain: Number(a.metric) || 0,
      slot: null,
      displaced: null,
      ageBonus: 0
    })).sort((a, b) => (b.metric || 0) - (a.metric || 0));
  }
  const roster = team.players.slice();
  const opt = TeamNeedsModel.optimize(roster, state.slots);
  return state.agents.map(a => {
    const fit = TeamNeedsModel.candidateGain(a, opt);
    return {
      ...a,
      gain: fit.gain,
      slot: fit.slot,
      displaced: fit.displaced,
      ageBonus: fit.ageBonus || 0
    };
  }).sort((a, b) => b.gain - a.gain || (b.metric || 0) - (a.metric || 0));
}

function currentTeam(){
  return state.teams.find(t => t.team === state.selectedTeam) || state.teams[0];
}

function filteredList(){
  const team = currentTeam();
  if (!team) return [];
  const scored = state.scoredByTeam[team.team] || [];
  const pos = document.getElementById('posFilter').value;
  const q = normalizeName(document.getElementById('search').value);
  let rows = scored.filter(a => {
    if (!matchesPosFilter(a.positions, pos)) return false;
    if (!q) return true;
    return normalizeName(a.name).includes(q) || normalizeName(a.nbaTeam).includes(q);
  });
  const sort = state.tableSort || {key: 'gain', dir: 'desc'};
  const key = sort.key || 'gain';
  const dir = sort.dir || 'desc';
  const TS = window.TableSort;
  rows = rows.slice().sort((a, b) => {
    function val(row){
      if (key === 'name') return row.name;
      if (key === 'metric') return row.metric;
      if (key === 'lockOvr') return row.lockOvr;
      if (key === 'tradeScore') return row.tradeScore != null ? row.tradeScore : row.tradeStars;
      if (key === 'age') return Number.isFinite(row.age) ? row.age : null;
      if (key === 'ovr') return row.ovr;
      if (key === 'gain') return row.gain;
      if (key === 'fitLabel') return row.slot || 'Bench / depth';
      return row.gain;
    }
    const c = TS ? TS.cmp(val(a), val(b), dir) : 0;
    if (c) return c;
    if (TS){
      const tie = TS.cmp(a.gain, b.gain, 'desc');
      if (tie) return tie;
      return TS.cmp(a.name, b.name, 'asc');
    }
    return (b.gain || 0) - (a.gain || 0) || a.name.localeCompare(b.name);
  });
  return rows;
}

function render(){
  const team = currentTeam();
  if (!team) return;
  const color = TEAM_COLORS[team.team] || 'var(--gold)';
  document.getElementById('teamTitle').textContent = team.team + (team.team === MY_TEAM ? ' (you)' : '');
  document.getElementById('teamSub').textContent =
    'Top 3 adds · lineup lift vs optimized starters';

  document.querySelectorAll('.team-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.team === team.team);
  });

  const rows = filteredList();
  const top = rows.slice(0, 3);
  const fitGrid = document.getElementById('fitGrid');
  if (!top.length){
    fitGrid.innerHTML = '<div class="fit-card" style="--team-color:' + color + '">'
      + '<p class="rank">No clear upgrades</p>'
      + '<h3 class="name">Thin wire</h3>'
      + '<p class="why">Nobody left moves the needle much for this roster under current projections.</p></div>';
  } else {
    fitGrid.innerHTML = top.map((a, i) => {
      const why = a.slot
        ? ('Would push into <strong>' + escapeHtml(a.slot) + '</strong>'
          + (a.displaced ? ' over ' + escapeHtml(a.displaced.player.name) : ' (open/upgrade)')
          + '.')
        : 'Depth add — does not crack the optimized starters.';
      return '<article class="fit-card" style="--team-color:' + color + '">'
        + '<p class="rank">Target #' + (i + 1) + '</p>'
        + '<h3 class="name">' + escapeHtml(a.name) + '</h3>'
        + '<p class="meta">' + escapeHtml(a.pos) + ' \u00b7 ' + escapeHtml(a.nbaTeam || 'FA')
        + (a.lockOvr != null ? ' \u00b7 Lock ' + Math.round(a.lockOvr) : '')
        + (a.tradeStars != null ? ' \u00b7 ' + (window.LockInDist && LockInDist.formatStars
          ? LockInDist.formatStars(a.tradeStars) : (a.tradeStars + '\u2605')) : '')
        + (a.metric != null ? ' \u00b7 ' + a.metric.toFixed(1) + ' proj' : '')
        + ' \u00b7 lift <span class="gain">+' + a.gain.toFixed(1) + '</span></p>'
        + '<p class="why">' + why + '</p></article>';
    }).join('');
  }

  const body = document.getElementById('faBody');
  const empty = document.getElementById('faEmpty');
  if (!rows.length){
    body.innerHTML = '';
    empty.hidden = false;
    if (window.TableSort){
      TableSort.decorateThead(document.querySelector('.board thead'), state.tableSort);
    }
    return;
  }
  empty.hidden = true;
  body.innerHTML = rows.map((a, i) => {
    const ageTag = Number.isFinite(a.age) && a.age < 24
      ? '<span class="tag young">Young</span>' : '';
    const rookTag = a.isRookie ? '<span class="tag">Rookie</span>' : '';
    const fit = a.slot
      ? ('<span class="slot">' + escapeHtml(a.slot) + '</span>'
        + (a.displaced ? ' over ' + escapeHtml(a.displaced.player.name) : ''))
      : 'Bench / depth';
    return '<tr class="' + (team.team === MY_TEAM ? 'mine' : '') + '">'
      + '<td class="rk">' + (i + 1) + '</td>'
      + '<td class="player">' + escapeHtml(a.name) + ageTag + rookTag
      + '<span class="sub">' + escapeHtml(a.pos) + ' \u00b7 ' + escapeHtml(a.nbaTeam || 'FA')
      + (a.injuryStatus ? ' \u00b7 ' + escapeHtml(a.injuryStatus) : '')
      + '</span></td>'
      + '<td class="num">' + (a.metric != null ? a.metric.toFixed(1) : '\u2014') + '</td>'
      + lockCellHtml(a)
      + '<td class="trade">' + tradeStarsHtml(a.tradeStars) + '</td>'
      + '<td class="num hide-sm">' + (Number.isFinite(a.age) ? a.age : '\u2014') + '</td>'
      + '<td class="num hide-sm">' + (a.ovr != null ? a.ovr : '\u2014') + '</td>'
      + '<td class="num">+' + a.gain.toFixed(1) + '</td>'
      + '<td class="fit">' + fit + '</td>'
      + '</tr>';
  }).join('');
  if (window.TableSort){
    TableSort.decorateThead(document.querySelector('.board thead'), state.tableSort);
  }
}

async function load(){
  const status = document.getElementById('status');
  const tag = document.getElementById('progressTag');
  try {
    const [leagueRes, usersRes, rostersRes, playersRes] = await Promise.all([
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID),
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/users'),
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/rosters'),
      fetch('https://api.sleeper.app/v1/players/nba')
    ]);
    if (!leagueRes.ok || !usersRes.ok || !rostersRes.ok || !playersRes.ok){
      throw new Error('Sleeper league request failed');
    }
    const league = await leagueRes.json();
    const users = await usersRes.json();
    const rosters = await rostersRes.json();
    const playerDb = await playersRes.json();

    status.textContent = 'Scoring free agents against each roster\u2026';
    const scoring = league.scoring_settings || {};
    const season = league.season || '2026';
    const projById = new Map();
    try {
      const projRes = await fetch('https://api.sleeper.com/projections/nba/' + season + '?season_type=regular');
      if (!projRes.ok) throw new Error('HTTP ' + projRes.status);
      const rows = await projRes.json();
      (rows || []).forEach(row => {
        const stats = row.stats || {};
        let total = 0, matched = 0;
        Object.keys(scoring).forEach(k => {
          if (stats[k] != null){ total += stats[k] * scoring[k]; matched++; }
        });
        if (matched && row.player_id) projById.set(String(row.player_id), total);
      });
      if (!projById.size) throw new Error('no usable projection stats');
    } catch (pe){
      status.textContent = 'Projections thin (' + (pe.message || pe) + '); ranking by Lock / 2K fallback.';
    }

    /* Prefer consensus proj for Lock seeds when the snapshot matches this season. */
    const cons = window.NBA_PROJ_CONSENSUS || {};
    if (!cons.season || String(cons.season) === String(season)){
      Object.keys(cons.players || {}).forEach(key => {
        const row = cons.players[key];
        if (!row || !row.sleeperId) return;
        const id = String(row.sleeperId);
        if (projById.has(id)) return;
        const stats = row.stats || {};
        let total = 0, matched = 0;
        Object.keys(scoring).forEach(k => {
          if (stats[k] != null && Number.isFinite(Number(stats[k]))){
            total += Number(stats[k]) * Number(scoring[k]);
            matched++;
          }
        });
        if (matched) projById.set(id, total);
      });
    }

    const userById = {};
    users.forEach(u => { userById[u.user_id] = u; });
    state.slots = window.TeamNeedsModel
      ? TeamNeedsModel.parseSlots(league.roster_positions || [])
      : (league.roster_positions || []).filter(s => !['BN','IR','TAXI'].includes(s));

    const rostered = new Set();
    const rosterIds = [];
    rosters.forEach(r => {
      [].concat(r.players || [], r.reserve || [], r.taxi || []).forEach(pid => {
        rostered.add(String(pid));
        rosterIds.push(String(pid));
      });
    });

    /* Build a preliminary FA shortlist before Lock scoring so we only fetch
       values for players who can appear on the board. */
    const prelimAgents = Object.entries(playerDb).filter(([pid, p]) => {
      if (!p || rostered.has(String(pid))) return false;
      const name = playerName(p);
      if (!name) return false;
      if (!(p.active === true || (!!p.team && p.active !== false))) return false;
      const rec = makeRecord(pid, playerDb, projById, null);
      if (rec.metric != null && rec.metric >= 8) return true;
      if (rec.ovr != null && rec.ovr >= 75) return true;
      if (rec.isRookie && rec.nbaTeam && rec.nbaTeam !== 'FA') return true;
      if (Number.isFinite(rec.age) && rec.age <= 23 && rec.nbaTeam) return true;
      return false;
    }).map(([pid]) => String(pid));

    let statsSeason = season;
    if (league.previous_league_id){
      try {
        const prevRes = await fetch('https://api.sleeper.app/v1/league/' + league.previous_league_id);
        if (prevRes.ok) statsSeason = (await prevRes.json()).season || statsSeason;
      } catch (e){ /* keep current */ }
    }

    let lockDist = {};
    if (window.LockInDist && typeof LockInDist.fetchLockValueIndex === 'function'){
      status.textContent = 'Building Lock OVR / Trade \u2605 for free agents\u2026';
      try {
        const lockPack = await LockInDist.fetchLockValueIndex({
          scoring,
          statsSeason,
          playerDb,
          projById,
          playerIds: prelimAgents.concat(rosterIds),
          twoKSnapshot: TWO_K
        });
        lockDist = lockPack.distMap || {};
        state.lockStatsSeason = lockPack.statsSeason;
      } catch (le){
        status.textContent = 'Lock values unavailable (' + (le.message || le) + '); showing proj / 2K only.';
      }
    }

    state.teams = rosters.map(r => {
      const u = userById[r.owner_id] || {};
      const raw = (u.metadata && u.metadata.team_name) || u.display_name || ('Roster ' + r.roster_id);
      const team = canonicalTeam(raw);
      const ids = []
        .concat(r.players || [])
        .concat(r.reserve || [])
        .concat(r.taxi || [])
        .map(String);
      return {
        rosterId: r.roster_id,
        team,
        manager: u.display_name || '',
        players: ids.map(pid => makeRecord(pid, playerDb, projById, lockDist))
      };
    }).sort((a, b) => {
      if (a.team === MY_TEAM) return -1;
      if (b.team === MY_TEAM) return 1;
      return a.team.localeCompare(b.team);
    });

    state.agents = prelimAgents.map(pid => makeRecord(pid, playerDb, projById, lockDist))
      .sort((a, b) => (b.lockOvr || 0) - (a.lockOvr || 0)
        || (b.metric || 0) - (a.metric || 0)
        || (b.ovr || 0) - (a.ovr || 0));

    if (state.agents.length > 180){
      state.agents = state.agents.slice(0, 180);
    }

    state.scoredByTeam = {};
    state.teams.forEach(t => {
      state.scoredByTeam[t.team] = scoreAgentsForTeam(t);
    });

    if (!state.teams.some(t => t.team === state.selectedTeam) && state.teams[0]){
      state.selectedTeam = state.teams[0].team;
    }

    const nav = document.getElementById('teamNav');
    nav.innerHTML = state.teams.map(t => {
      const c = TEAM_COLORS[t.team] || '#E8C34A';
      return '<button type="button" class="team-chip" data-team="' + escapeHtml(t.team)
        + '" style="--chip-color:' + c + '">'
        + '<span class="dot" style="background:' + c + '"></span>'
        + escapeHtml(t.team)
        + (t.team === MY_TEAM ? ' · you' : '')
        + '</button>';
    }).join('');
    nav.querySelectorAll('.team-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedTeam = btn.dataset.team;
        render();
      });
    });

    ['posFilter','search'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });
    document.getElementById('sortBy').addEventListener('change', () => {
      applySortSelectToState();
      render();
    });
    if (window.TableSort){
      TableSort.bindThead(document.querySelector('.board'), () => state.tableSort, next => {
        state.tableSort = next;
        syncSortSelectFromState();
        render();
      });
    }
    applySortSelectToState();

    document.getElementById('app').hidden = false;
    const withLock = state.agents.filter(a => a.lockOvr != null).length;
    tag.textContent = state.agents.length + ' free agents';
    status.classList.remove('error');
    status.textContent = 'Three best adds for the selected team (same optimizer as Team Intel). '
      + state.agents.length + ' free agents · ' + withLock + ' with Lock OVR / Trade \u2605'
      + (state.lockStatsSeason ? ' (' + state.lockStatsSeason + ' smash)' : '')
      + '.';
    render();
  } catch (e){
    status.classList.add('error');
    status.textContent = 'Could not load free agents: ' + (e.message || e);
    tag.textContent = 'Error';
  }
}

load();
</script>
</body>
</html>
