<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patio Boys — Weekly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F131B; --surface:#171D28; --surface-2:#1F2735;
    --ink:#ECEEF3; --ink-dim:#8B93A6; --hairline:#2E3645;
    --gold:#E8C34A; --coral:#D8553A; --green:#1D9E75; --blue:#3A8FC9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;line-height:1.45}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px 48px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0;border-bottom:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px}
  .topbar .brand .gm{font-family:'Anton',sans-serif;font-size:18px;color:var(--ink);letter-spacing:.04em}
  .topbar .brand .gm em{color:var(--gold);font-style:normal}
  body.embed .topbar{padding:10px 0}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:16px 0 0}
  .status.error{color:var(--coral)}

  .report-head{
    display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
    margin:18px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--hairline);
  }
  .report-head h1{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:30px;margin:0;letter-spacing:.03em;
  }
  .report-head .sub{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0;
  }
  .week-pick{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.05em;
  }
  .week-pick select{
    background:var(--surface);color:var(--ink);border:1px solid var(--hairline);
    border-radius:6px;padding:6px 10px;font:inherit;color:var(--ink);
  }

  .section{margin:22px 0 0}
  .section h2{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;
  }

  .best-worst{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  @media(max-width:560px){.best-worst{grid-template-columns:1fr}}
  .bw-card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:10px;
    padding:14px 14px 12px;border-top:3px solid var(--team, var(--gold));
  }
  .bw-card.worst{border-top-color:var(--coral)}
  .bw-card .lbl{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;
  }
  .bw-card .name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:20px;margin:0;line-height:1.05}
  .bw-card .mgr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin:4px 0 8px}
  .bw-card .pts{font-family:'Anton',sans-serif;font-size:28px;color:var(--gold);margin:0;line-height:1}

  .pos-list,.award-grid,.fa-row,.match-list,.perf-list{display:grid;gap:8px}
  .pos-row,.award-card,.fa-card,.match-card,.perf-row{
    background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;
  }
  .pos-row{
    display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
  }
  .pos-row .pos{
    font-family:'Anton',sans-serif;font-size:16px;color:var(--gold);letter-spacing:.04em;
  }
  .pos-row .who{margin:0;font-size:15px}
  .pos-row .meta{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    margin:2px 0 0;letter-spacing:.03em;
  }
  .pos-row .fp{font-family:'Anton',sans-serif;font-size:22px;color:var(--ink);margin:0}

  .award-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:560px){.award-grid{grid-template-columns:1fr}}
  .award-card .lbl{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;
  }
  .award-card .who{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0}
  .award-card .detail{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin:6px 0 0;line-height:1.5;
  }
  .award-card .detail strong{color:var(--gold);font-weight:600}

  .fa-row{grid-template-columns:repeat(5,minmax(0,1fr))}
  @media(max-width:720px){.fa-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .fa-card .pos{font-family:'Anton',sans-serif;font-size:14px;color:var(--gold);margin:0 0 4px}
  .fa-card .who{margin:0;font-size:14px}
  .fa-card .meta{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);margin:4px 0 0;
  }

  .match-card{
    display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  }
  .match-side{min-width:0}
  .match-side.right{text-align:right}
  .match-side .tname{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:15px;margin:0;line-height:1.1;
  }
  .match-side .mgr{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);margin:2px 0 4px;
  }
  .match-side .score{font-family:'Anton',sans-serif;font-size:22px;margin:0}
  .match-side.win .score{color:var(--green)}
  .match-side.lose .score{color:var(--coral)}
  .match-vs{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.1em;
  }

  .perf-row{display:grid;gap:6px}
  .perf-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .perf-top .rank{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-right:6px;
  }
  .perf-top .tname{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:16px}
  .perf-top .pct{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold)}
  .perf-bar{
    height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;
  }
  .perf-bar > span{
    display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));
    border-radius:999px;
  }
  .perf-meta{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
  }
  .empty{color:var(--ink-dim);font-size:14px;margin:0}
</style>
</head>
<body>
<script src="hq-loader.js"></script>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');</script>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="gm">Patio Boys <em>HQ</em></span><span>Weekly Report</span></div>
    <span id="progressTag">Loading</span>
  </div>
  <p class="status" id="status">Loading week report…</p>
  <div id="report" hidden></div>
</div>

<script>
(function(){
  var v = new URLSearchParams(location.search).get('nocache') || '20261123-week5';
  ['hq-share.js','team-needs.js'].forEach(function(src){
    document.write('<script src="'+src+'?v='+encodeURIComponent(v)+'"><\/script>');
  });
})();
</script>
<script>
const LEAGUE_ID = '1350649177381552128';
const TEAM_COLORS = {
  'Funeral Home':'#C9963A', 'BoobieDominguez':'#1D9E75', '2011-12 Champs':'#D8553A',
  'Freakonomics':'#7F77DD', 'Papa Book':'#D4537E', 'Bam Add the Mayo':'#3A8FC9',
  'Hamas':'#9B59B6', 'Belt':'#5DBB63'
};
const TEAM_ALIASES = {
  '20112012champs':'2011-12 Champs',
  'thehitmanharts':'BoobieDominguez',
  'boobiedominguez':'BoobieDominguez',
  'badgersretirementhome':'Funeral Home',
  'belt':'Belt',
  '5iveonit':'BoobieDominguez',
  'lovecadecountry':'Belt',
  'aliofdan':'Belt',
  'radeka':'Papa Book',
  'oreokidronaldo':'Freakonomics',
  'fadie':'Hamas',
  'addiejarrar':'2011-12 Champs',
  'jsimbulan3':'Bam Add the Mayo',
  'baderalhindi':'Funeral Home'
};
const CORE_POS = ['PG', 'SG', 'SF', 'PF', 'C'];

const statusEl = document.getElementById('status');
const reportEl = document.getElementById('report');
const progressTag = document.getElementById('progressTag');

function norm(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}
function franchiseKey(teamName, managerName){
  const byMgr = norm(managerName);
  if (byMgr && TEAM_ALIASES[byMgr]) return TEAM_ALIASES[byMgr];
  const mgrMatch = byMgr
    ? Object.keys(TEAM_COLORS).find(k => norm(k) === byMgr)
    : null;
  if (mgrMatch) return mgrMatch;
  const n = norm(teamName);
  if (TEAM_ALIASES[n]) return TEAM_ALIASES[n];
  const match = Object.keys(TEAM_COLORS).find(k => norm(k) === n);
  return match || teamName || managerName || 'Unknown';
}
function fmtFp(n){
  const v = Number(n);
  if (!Number.isFinite(v)) return '—';
  return (Math.round(v * 100) / 100).toFixed(2);
}
function shortName(p, pid){
  if (!p) return 'Player ' + pid;
  const first = p.first_name ? String(p.first_name).charAt(0) + '.' : '';
  const last = p.last_name || p.full_name || ('#' + pid);
  return (first ? first + ' ' : '') + last;
}
function playerPos(p){
  const elig = (p && (p.fantasy_positions || (p.position ? [p.position] : []))) || [];
  for (let i = 0; i < CORE_POS.length; i++){
    if (elig.indexOf(CORE_POS[i]) >= 0) return CORE_POS[i];
  }
  return elig[0] || '—';
}
function matchupPoints(m){
  if (!m) return 0;
  if (m.custom_points != null && Number.isFinite(Number(m.custom_points))){
    return Number(m.custom_points);
  }
  return Number(m.points) || 0;
}
function scoreWeekly(obj, scoring){
  if (!obj || !scoring) return null;
  let total = 0, matched = 0;
  Object.keys(scoring).forEach(k => {
    if (obj[k] != null && Number.isFinite(Number(obj[k]))){
      total += Number(obj[k]) * Number(scoring[k]);
      matched++;
    }
  });
  if (!matched) return null;
  const gp = obj.gp || obj.games_played || null;
  return gp && gp > 0 ? total / gp : total;
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function fetchJson(url){
  if (window.PatioBoysShare && typeof PatioBoysShare.fetchJsonCached === 'function'){
    return PatioBoysShare.fetchJsonCached(url, url);
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
  return res.json();
}

function buildTeams(users, rosters){
  const userById = {};
  (users || []).forEach(u => { userById[u.user_id] = u; });
  return (rosters || []).map(r => {
    const u = userById[r.owner_id] || {};
    const raw = (u.metadata && u.metadata.team_name) || u.display_name || ('Roster ' + r.roster_id);
    const key = franchiseKey(raw, u.display_name);
    return {
      key,
      displayName: TEAM_COLORS[key] ? key : raw,
      sleeperName: raw,
      manager: u.display_name || '',
      rosterId: r.roster_id,
      taxi: (r.taxi || []).map(String),
      reserve: (r.reserve || []).map(String),
      players: Array.from(new Set([].concat(r.players || [], r.reserve || [], r.taxi || []).map(String))),
      color: TEAM_COLORS[key] || '#8B93A6'
    };
  });
}

function weekScoreRows(matchups, teams){
  const byRoster = {};
  teams.forEach(t => { byRoster[String(t.roster_id != null ? t.roster_id : t.rosterId)] = t; });
  return (matchups || []).map(m => {
    const t = byRoster[String(m.roster_id)];
    if (!t) return null;
    return {
      team: t,
      matchup: m,
      points: matchupPoints(m),
      matchupId: m.matchup_id
    };
  }).filter(Boolean);
}

function computeOptimal(m, team, playerDb, slots){
  const Needs = window.TeamNeedsModel;
  if (!Needs || !Needs.optimize) return null;
  const ptsMap = m.players_points || {};
  const excluded = new Set([].concat(team.taxi || [], team.reserve || []).map(String));
  const rosterPlayers = (m.players || team.players || []).map(String)
    .filter(pid => !excluded.has(pid));
  const recs = rosterPlayers.map(pid => {
    const pl = (playerDb && playerDb[pid]) || {};
    const metric = Number(ptsMap[pid]);
    if (!Number.isFinite(metric) || metric <= 0) return null;
    return {
      id: pid,
      positions: pl.fantasy_positions || [pl.position].filter(Boolean),
      metric
    };
  }).filter(Boolean);
  const opt = Needs.optimize(recs, slots);
  return opt && Number(opt.total) > 0 ? Number(opt.total) : null;
}

function highestByPos(matchups, teams, playerDb){
  const owned = {};
  teams.forEach(t => {
    (t.players || []).forEach(pid => { owned[String(pid)] = t; });
  });
  const best = {};
  CORE_POS.forEach(p => { best[p] = null; });
  (matchups || []).forEach(m => {
    const ptsMap = m.players_points || {};
    Object.keys(ptsMap).forEach(pid => {
      const fp = Number(ptsMap[pid]);
      if (!Number.isFinite(fp) || fp <= 0) return;
      const pl = playerDb[pid] || {};
      const pos = playerPos(pl);
      if (CORE_POS.indexOf(pos) < 0) return;
      const cur = best[pos];
      if (!cur || fp > cur.fp + 1e-9){
        best[pos] = {
          pid,
          fp,
          pos,
          name: shortName(pl, pid),
          team: owned[String(pid)] || null,
          opp: pl.team || ''
        };
      }
    });
  });
  return CORE_POS.map(p => best[p]).filter(Boolean);
}

function pairMatchups(rows){
  const byMid = {};
  rows.forEach(r => {
    const mid = r.matchupId;
    if (mid == null) return;
    (byMid[mid] = byMid[mid] || []).push(r);
  });
  return Object.keys(byMid).map(Number).sort((a, b) => a - b).map(mid => {
    const pair = byMid[mid].slice().sort((a, b) => b.points - a.points);
    return { matchupId: mid, sides: pair };
  });
}

function topFreeAgents(playerDb, ownedSet, seasonStats, scoring){
  const cands = [];
  Object.keys(playerDb || {}).forEach(pid => {
    if (ownedSet.has(String(pid))) return;
    const pl = playerDb[pid];
    if (!pl || pl.sport && pl.sport !== 'nba') return;
    if (pl.status === 'Retired' || pl.injury_status === 'IR') return;
    const pos = playerPos(pl);
    if (CORE_POS.indexOf(pos) < 0) return;
    const avg = scoreWeekly(seasonStats && seasonStats[pid], scoring);
    if (avg == null || !(avg > 0)) return;
    cands.push({
      pid, pos, avg,
      name: shortName(pl, pid),
      team: pl.team || 'FA'
    });
  });
  const out = {};
  CORE_POS.forEach(pos => {
    const list = cands.filter(c => c.pos === pos).sort((a, b) => b.avg - a.avg);
    if (list[0]) out[pos] = list[0];
  });
  return CORE_POS.map(p => out[p]).filter(Boolean);
}

function renderReport(pack){
  const {
    week, lastReport, rows, matchups, awards, picks, fas, pairs, perf
  } = pack;

  const best = rows.slice().sort((a, b) => b.points - a.points)[0];
  const worst = rows.slice().sort((a, b) => a.points - b.points)[0];

  reportEl.innerHTML = ''
    + '<div class="report-head">'
    +   '<div><h1>Weekly Report</h1>'
    +   '<p class="sub">Week ' + week
    +   (lastReport === week ? ' · latest closed week' : '')
    +   '</p></div>'
    +   '<label class="week-pick">Week '
    +   '<select id="weekSelect">' + pack.weekOptions + '</select></label>'
    + '</div>'

    + '<div class="section"><h2>Best &amp; Worst</h2><div class="best-worst">'
    +   (best ? (
      '<div class="bw-card" style="--team:' + esc(best.team.color) + '">'
      + '<p class="lbl">Best team</p>'
      + '<p class="name">' + esc(best.team.sleeperName || best.team.displayName) + '</p>'
      + '<p class="mgr">@' + esc(best.team.manager) + '</p>'
      + '<p class="pts">' + fmtFp(best.points) + '</p></div>'
    ) : '')
    +   (worst ? (
      '<div class="bw-card worst" style="--team:' + esc(worst.team.color) + '">'
      + '<p class="lbl">Worst team</p>'
      + '<p class="name">' + esc(worst.team.sleeperName || worst.team.displayName) + '</p>'
      + '<p class="mgr">@' + esc(worst.team.manager) + '</p>'
      + '<p class="pts">' + fmtFp(worst.points) + '</p></div>'
    ) : '')
    + '</div></div>'

    + '<div class="section"><h2>Highest Scoring Picks</h2><div class="pos-list">'
    + (picks.length ? picks.map(p => (
      '<div class="pos-row"><div class="pos">' + esc(p.pos) + '</div>'
      + '<div><p class="who">' + esc(p.name) + '</p>'
      + '<p class="meta">'
      + (p.team ? ('@' + esc(p.team.manager)) : 'FA')
      + (p.opp ? (' · ' + esc(p.opp)) : '')
      + '</p></div>'
      + '<p class="fp">' + fmtFp(p.fp) + '</p></div>'
    )).join('') : '<p class="empty">No scored picks yet.</p>')
    + '</div></div>'

    + '<div class="section"><h2>League Awards</h2><div class="award-grid">'
    + awards.map(a => (
      '<div class="award-card"><p class="lbl">' + esc(a.label) + '</p>'
      + '<p class="who">' + esc(a.who) + '</p>'
      + '<p class="detail">' + a.detail + '</p></div>'
    )).join('')
    + '</div></div>'

    + '<div class="section"><h2>Top Free Agents · avg FPts</h2><div class="fa-row">'
    + (fas.length ? fas.map(f => (
      '<div class="fa-card"><p class="pos">' + esc(f.pos) + '</p>'
      + '<p class="who">' + esc(f.name) + '</p>'
      + '<p class="meta">' + esc(f.team) + ' · ' + fmtFp(f.avg) + '</p></div>'
    )).join('') : '<p class="empty">No FA averages yet.</p>')
    + '</div></div>'

    + '<div class="section"><h2>Team Matchups</h2><div class="match-list">'
    + (pairs.length ? pairs.map(pair => {
      const a = pair.sides[0];
      const b = pair.sides[1];
      if (!a || !b) return '';
      const aWin = a.points > b.points + 1e-9;
      const bWin = b.points > a.points + 1e-9;
      function side(r, right, win){
        return '<div class="match-side ' + (right ? 'right ' : '') + (win ? 'win' : (aWin || bWin ? 'lose' : '')) + '">'
          + '<p class="tname">' + esc(r.team.sleeperName || r.team.displayName) + '</p>'
          + '<p class="mgr">@' + esc(r.team.manager) + '</p>'
          + '<p class="score">' + fmtFp(r.points) + '</p></div>';
      }
      return '<div class="match-card">' + side(a, false, aWin)
        + '<div class="match-vs">vs</div>' + side(b, true, bWin) + '</div>';
    }).join('') : '<p class="empty">No matchups.</p>')
    + '</div></div>'

    + '<div class="section"><h2>Pick Performance</h2><div class="perf-list">'
    + (perf.length ? perf.map((r, i) => (
      '<div class="perf-row">'
      + '<div class="perf-top"><div><span class="rank">#' + (i + 1) + '</span>'
      + '<span class="tname">' + esc(r.team.sleeperName || r.team.displayName) + '</span></div>'
      + '<span class="pct">' + (r.pct != null ? (Math.round(r.pct * 1000) / 10).toFixed(1) + '%' : '—') + '</span></div>'
      + '<div class="perf-bar"><span style="width:' + (r.pct != null ? Math.min(100, r.pct * 100) : 0) + '%"></span></div>'
      + '<div class="perf-meta">' + fmtFp(r.points) + ' of ' + fmtFp(r.max) + ' MAX</div></div>'
    )).join('') : '<p class="empty">Need scored nights for Max PF.</p>')
    + '</div></div>';

  const sel = document.getElementById('weekSelect');
  if (sel){
    sel.value = String(week);
    sel.onchange = () => loadWeek(Number(sel.value));
  }
}

async function loadWeek(week){
  statusEl.classList.remove('error');
  statusEl.textContent = 'Loading Week ' + week + '…';
  progressTag.textContent = 'Loading';
  reportEl.hidden = true;

  try {
    const [league, users, rosters, matchups, nba, playerDb] = await Promise.all([
      fetchJson('https://api.sleeper.app/v1/league/' + LEAGUE_ID),
      fetchJson('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/users'),
      fetchJson('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/rosters'),
      fetchJson('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/matchups/' + week),
      fetchJson('https://api.sleeper.app/v1/state/nba'),
      (window.PatioBoysShare && typeof PatioBoysShare.fetchPlayersNba === 'function')
        ? PatioBoysShare.fetchPlayersNba()
        : fetchJson('https://api.sleeper.app/v1/players/nba')
    ]);

    const lastReport = Number(league.settings && league.settings.last_report)
      || Number(league.settings && league.settings.last_scored_leg)
      || null;
    const maxWeek = Math.max(
      Number(nba && nba.leg) || 0,
      Number(nba && nba.week) || 0,
      lastReport || 0,
      week
    );
    const teams = buildTeams(users, rosters);
    const rows = weekScoreRows(matchups, teams)
      .sort((a, b) => b.points - a.points);
    const slots = (window.TeamNeedsModel && TeamNeedsModel.parseSlots)
      ? TeamNeedsModel.parseSlots(league.roster_positions || [])
      : ['PG','SG','G','SF','PF','F','C','UTIL','UTIL','UTIL'];

    const withMax = rows.map(r => {
      const max = computeOptimal(r.matchup, r.team, playerDb, slots);
      const pct = max != null && max > 0 ? Math.min(1, r.points / max) : null;
      return Object.assign({}, r, { max, pct });
    });

    const winners = [];
    const losers = [];
    pairMatchups(rows).forEach(pair => {
      if (pair.sides.length < 2) return;
      const [hi, lo] = pair.sides[0].points >= pair.sides[1].points
        ? [pair.sides[0], pair.sides[1]]
        : [pair.sides[1], pair.sides[0]];
      if (hi.points > lo.points + 1e-9){
        winners.push(hi);
        losers.push(lo);
      }
    });

    const mostEff = withMax.filter(r => r.pct != null)
      .slice().sort((a, b) => b.pct - a.pct)[0];
    const leastEff = withMax.filter(r => r.pct != null)
      .slice().sort((a, b) => a.pct - b.pct)[0];
    const highLoss = losers.slice().sort((a, b) => b.points - a.points)[0];
    const lowWin = winners.slice().sort((a, b) => a.points - b.points)[0];

    function mgrLabel(row){
      return row && row.team ? (row.team.manager || row.team.displayName) : '—';
    }
    function oppLabel(row){
      if (!row) return '';
      const pair = pairMatchups(rows).find(p =>
        p.sides.some(s => s.team.rosterId === row.team.rosterId));
      if (!pair) return '';
      const opp = pair.sides.find(s => s.team.rosterId !== row.team.rosterId);
      return opp
        ? ('vs @' + esc(opp.team.manager) + ' (' + fmtFp(opp.points) + ')')
        : '';
    }

    const awards = [
      {
        label: 'Most Efficient Manager',
        who: mgrLabel(mostEff),
        detail: mostEff
          ? ('<strong>' + fmtFp(mostEff.points) + '</strong> of '
            + fmtFp(mostEff.max) + ' MAX')
          : '—'
      },
      {
        label: 'Least Efficient Manager',
        who: mgrLabel(leastEff),
        detail: leastEff
          ? ('<strong>' + fmtFp(leastEff.points) + '</strong> of '
            + fmtFp(leastEff.max) + ' MAX')
          : '—'
      },
      {
        label: 'Highest Pts in Loss',
        who: mgrLabel(highLoss),
        detail: highLoss
          ? ('<strong>' + fmtFp(highLoss.points) + '</strong> · ' + oppLabel(highLoss))
          : '—'
      },
      {
        label: 'Lowest Pts in Win',
        who: mgrLabel(lowWin),
        detail: lowWin
          ? ('<strong>' + fmtFp(lowWin.points) + '</strong> · ' + oppLabel(lowWin))
          : '—'
      }
    ];

    statusEl.textContent = 'Scoring free-agent averages…';
    let seasonStats = {};
    try {
      seasonStats = await fetchJson(
        'https://api.sleeper.app/v1/stats/nba/regular/' + league.season
      );
    } catch (e){ seasonStats = {}; }

    const owned = new Set();
    teams.forEach(t => (t.players || []).forEach(pid => owned.add(String(pid))));
    const fas = topFreeAgents(playerDb, owned, seasonStats, league.scoring_settings || {});
    const picks = highestByPos(matchups, teams, playerDb);
    const pairs = pairMatchups(rows);
    const perf = withMax.slice().sort((a, b) => {
      if (a.pct == null && b.pct == null) return b.points - a.points;
      if (a.pct == null) return 1;
      if (b.pct == null) return -1;
      return b.pct - a.pct || b.points - a.points;
    });

    const weekOptions = Array.from({ length: Math.max(1, maxWeek) }, (_, i) => i + 1)
      .map(w => '<option value="' + w + '"'
        + (w === week ? ' selected' : '') + '>Week ' + w
        + (lastReport === w ? ' · report' : '') + '</option>')
      .join('');

    renderReport({
      week, lastReport, rows, matchups, awards, picks, fas, pairs, perf, weekOptions
    });
    reportEl.hidden = false;
    statusEl.textContent = 'Week ' + week
      + (lastReport === week ? ' · Sleeper last_report' : '')
      + ' · ' + rows.length + ' teams';
    progressTag.textContent = 'Week ' + week;
  } catch (err){
    console.error(err);
    statusEl.classList.add('error');
    statusEl.textContent = 'Failed: ' + (err && err.message ? err.message : err);
    progressTag.textContent = 'Error';
  }
}

(async function boot(){
  try {
    const league = await fetchJson('https://api.sleeper.app/v1/league/' + LEAGUE_ID);
    const q = new URLSearchParams(location.search);
    const fromQ = Number(q.get('week'));
    const lastReport = Number(league.settings && league.settings.last_report)
      || Number(league.settings && league.settings.last_scored_leg)
      || 1;
    /* Monday morning: default to the closed report week, not the new leg. */
    const week = Number.isFinite(fromQ) && fromQ > 0 ? fromQ : lastReport;
    await loadWeek(week);
  } catch (err){
    statusEl.classList.add('error');
    statusEl.textContent = 'Failed: ' + (err && err.message ? err.message : err);
  }
})();
</script>
