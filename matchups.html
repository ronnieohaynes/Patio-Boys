<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#0F131B; --surface:#171D28; --surface-2:#1F2735;
    --ink:#ECEEF3; --ink-dim:#8B93A6; --hairline:#2E3645;
    --gold:#E8C34A; --coral:#D8553A; --green:#1D9E75;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 48px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0;border-bottom:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px}
  .topbar .brand .gm{font-family:'Anton',sans-serif;font-size:18px;color:var(--ink);letter-spacing:.04em}
  .topbar .brand .gm em{color:var(--gold);font-style:normal}
  body.embed .topbar{padding:10px 0}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:16px 0 0}
  .status.error{color:var(--coral)}

  .controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    margin:16px 0 12px;padding-bottom:14px;border-bottom:1px solid var(--hairline);
  }
  .field{display:flex;flex-direction:column;gap:5px;min-width:120px}
  .field label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.08em;text-transform:uppercase;
  }
  .field select,.field input,.btn{
    background:var(--surface);border:1px solid var(--hairline);border-radius:6px;
    color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;
  }
  .btn{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:color-mix(in srgb, var(--gold) 18%, var(--surface));border-color:var(--gold);color:var(--gold)}

  .slate{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0 18px}
  .mu-card{
    border:1px solid var(--hairline);border-radius:8px;padding:12px 14px;background:var(--surface);
    cursor:pointer;text-align:left;color:inherit;width:100%;
  }
  .mu-card:hover{border-color:var(--ink-dim)}
  .mu-card.active{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 10%, var(--surface))}
  .mu-card .vs{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:16px;margin:0;line-height:1.15;
  }
  .mu-card .score{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:8px 0 0;
  }
  .mu-card .sub{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;margin:6px 0 0;
  }

  .report-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:8px 0 12px;
  }
  .report-head h1{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;margin:0;letter-spacing:.03em;
  }
  .report-head p{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;margin:0;
  }

  .advice{
    border:1px solid var(--hairline);border-radius:8px;padding:14px 16px;background:var(--surface);
    margin-bottom:16px;
  }
  .advice h2{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0 0 8px;letter-spacing:.03em;
  }
  .advice ul{margin:0;padding-left:18px}
  .advice li{margin:0 0 8px;font-size:14px;color:#C9CDD8}
  .advice li strong{color:var(--ink)}
  .advice .tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px;
  }
  .tag.smash{background:color-mix(in srgb, var(--green) 22%, transparent);color:var(--green)}
  .tag.bust{background:color-mix(in srgb, var(--coral) 22%, transparent);color:var(--coral)}
  .tag.lock{background:color-mix(in srgb, var(--gold) 22%, transparent);color:var(--gold)}
  .tag.news{background:color-mix(in srgb, #3A8FC9 22%, transparent);color:#7EB6E0}

  .shot{
    border:1px dashed var(--hairline);border-radius:8px;padding:12px 14px;background:var(--surface-2);
    margin-bottom:16px;
  }
  .shot-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .shot-preview{margin-top:10px;max-width:280px;border-radius:6px;border:1px solid var(--hairline)}
  .shot-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin:8px 0 0}

  .shot-status.err{color:var(--coral)}

  .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.sides{grid-template-columns:1fr}}
  .side{
    border:1px solid var(--hairline);border-radius:8px;overflow:hidden;background:var(--surface);
    border-top:3px solid var(--team-color, var(--gold));

  .side-head{

    padding:10px 12px;background:var(--surface-2);

  .side-head h3{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0}
  .side-head .pts{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--gold)}

  th,td{
    text-align:left;padding:8px 10px;
    border-bottom:1px solid color-mix(in srgb, var(--hairline) 80%, transparent);

  th{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-dim);

    display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;

  td.lean.bust{color:var(--coral);font-weight:600}
  tr.locked td{background:color-mix(in srgb, var(--green) 10%, transparent)}
  .lock-pill{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;

  .lock-pill.locked{color:#0b2; border-color:var(--green); background:color-mix(in srgb, var(--green) 18%, transparent)}
  .lock-pill.open{color:#6ec8ff; border-color:#3A8FC9; background:color-mix(in srgb, #3A8FC9 14%, transparent)}
  .lock-pill.none{color:var(--ink-dim); border-color:var(--hairline)}
  .lock-pill:hover{filter:brightness(1.15)}
  /* Sleeper-style lineup: name left, slot badge right */
  .player-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .player-main{min-width:0;flex:1}
  tr.bench td.player .player-main{font-weight:500;color:var(--ink-dim)}
  .slot-badge{
    -webkit-appearance:none;appearance:none;flex:0 0 auto;align-self:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;

  .slot-badge.pg{background:#2E3A66;color:#F0718A}
  .slot-badge.sg{background:#2E3A66;color:#F5A15C}
  .slot-badge.sf{background:#2E3A66;color:#E8C34A}
  .slot-badge.pf{background:#2E3A66;color:#6EC8FF}
  .slot-badge.c{background:#2E3A66;color:#B8A4FF}
  .slot-badge.g{
    background:linear-gradient(90deg,#FD6483 0%,#FD6483 70%,#FF8A4C 100%);
    color:#14080c;
  }
  .slot-badge.f{
    background:linear-gradient(90deg,#7ED9B0 0%,#7ED9B0 65%,#52B8E5 100%);
    color:#0a1a14;
  }
  .slot-badge.util{background:#8B64FB;color:#160c2e}
  .slot-badge.bn{background:#3B4364;color:#9AA3BD}
  .elig{font-weight:600}
  .elig.pg{color:#F0718A}.elig.sg{color:#F5A15C}.elig.sf{color:#E8C34A}
  .elig.pf{color:#6EC8FF}.elig.c{color:#B8A4FF}.elig.g{color:#FD6483}.elig.f{color:#7ED9B0}
  tr.section-row td{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);

    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);

<script>
const LEAGUE_ID = '1350649177381552128';
const MY_TEAM = 'Freakonomics';
const TEAM_COLORS = {
  'Funeral Home':'#C9963A','BoobieDominguez':'#1D9E75','2011-12 Champs':'#D8553A',
  'Freakonomics':'#7F77DD','Papa Book':'#D4537E','Bam Add the Mayo':'#3A8FC9',
  'Hamas':'#9B59B6','Belt':'#5DBB63'
};
const TEAM_ALIASES = {
  '20112012champs':'2011-12 Champs',
  '20112012champ':'2011-12 Champs',
  'thehitmanharts':'BoobieDominguez',
  'badgersretirementhome':'Funeral Home',
  'belt':'Belt'
};
/* Sleeper abbr → ESPN scoreboard abbr */
const SLEEPER_TO_ESPN = {
  ATL:'ATL', BKN:'BKN', BOS:'BOS', CHA:'CHA', CHI:'CHI', CLE:'CLE', DAL:'DAL', DEN:'DEN',
  DET:'DET', GSW:'GS', HOU:'HOU', IND:'IND', LAC:'LAC', LAL:'LAL', MEM:'MEM', MIA:'MIA',
  MIL:'MIL', MIN:'MIN', NOP:'NO', NYK:'NY', OKC:'OKC', ORL:'ORL', PHI:'PHI', PHX:'PHX',
  POR:'POR', SAC:'SAC', SAS:'SA', TOR:'TOR', UTA:'UTAH', WAS:'WSH'
};
const ESPN_TO_SLEEPER = Object.fromEntries(Object.entries(SLEEPER_TO_ESPN).map(([a,b]) => [b, a]));

const state = {
  league: null,
  users: [],
  rosters: [],
  players: {},
  week: null,
  maxWeek: 21,
  matchups: [],
  pairs: [],
  selectedPair: null,
  focusTeam: MY_TEAM,
  lockByPid: {},
  statsSeason: null,
  nbaWeek: null, /* { byTeam, oppg, avgOppg } from ESPN slate */
  /* Only green LOCKED nights — never inferred from “starter with points”. */
  lockMarks: {}, /* pid -> {pts, source:'ocr'|'manual', name, slot} */
  tesseractLoading: null
};

/* Starter lock-in slots in lineup order (bench is BN until changed). */
function lockSlotLabels(){
  const pos = (state.league && state.league.roster_positions) || [
    'PG', 'SG', 'G', 'SF', 'PF', 'F', 'C', 'UTIL', 'UTIL', 'UTIL', 'BN'
  ];
  const out = [];
  for (let i = 0; i < pos.length; i++){
    if (pos[i] === 'BN' || pos[i] === 'IR' || pos[i] === 'TAXI') break;
    out.push(pos[i]);
  }
  return out.length ? out : ['PG', 'SG', 'G', 'SF', 'PF', 'F', 'C', 'UTIL', 'UTIL', 'UTIL'];
}

function slotDisplayLabel(slotKey){
  if (slotKey == null || slotKey === 'BN') return 'BN';
  const labels = lockSlotLabels();
  const i = Number(slotKey);
  if (!Number.isFinite(i) || i < 0 || i >= labels.length) return 'BN';
  /* Mirror Sleeper: all three utility slots read “UTIL”, not UTIL 1/2/3. */
  return labels[i] || 'BN';
}

function slotBadgeClass(label){
  const lab = String(label || 'BN').toUpperCase();
  if (lab === 'PG') return 'pg';
  if (lab === 'SG') return 'sg';
  if (lab === 'SF') return 'sf';
  if (lab === 'PF') return 'pf';
  if (lab === 'C') return 'c';
  if (lab === 'G') return 'g';
  if (lab === 'F') return 'f';
  if (lab === 'UTIL') return 'util';
  return 'bn';
}

function eligHtml(p){
  const raw = (p && (p.fantasy_positions || (p.position ? [p.position] : []))) || [];
  const parts = raw.map(String).filter(Boolean);
  if (!parts.length) return '';
  return parts.map(pos => {
    const cls = slotBadgeClass(pos);
    return '<span class="elig ' + cls + '">' + escapeHtml(pos) + '</span>';
  }).join(' ');
}

function lockStorageKey(){
  return 'pb-matchup-locks:' + LEAGUE_ID + ':w' + String(state.week || '');
}
function loadLockMarks(){
  try {
    const raw = localStorage.getItem(lockStorageKey());
    state.lockMarks = raw ? (JSON.parse(raw) || {}) : {};
  } catch (e){ state.lockMarks = {}; }
}
function saveLockMarks(){
  try { localStorage.setItem(lockStorageKey(), JSON.stringify(state.lockMarks || {})); }
  catch (e){ /* ignore quota */ }
}

function normalizeName(name){
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[.\u2019']/g, '').replace(/[^a-z0-9]/g, '');
}
function canonicalTeam(name){
  const norm = normalizeName(name);
  if (TEAM_ALIASES[norm]) return TEAM_ALIASES[norm];
  return Object.keys(TEAM_COLORS).find(k => normalizeName(k) === norm) || name;
}
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function playerName(p){
  if (!p) return 'Unknown';
  if (p.full_name) return p.full_name;
  return ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || 'Unknown';
}
function progress(pct, label){
  if (window.PatioBoysLoader) PatioBoysLoader.reportProgress(pct, label);
}

function franchiseOfRoster(roster){
  const owner = state.users.find(u => u.user_id === roster.owner_id);
  const metaName = owner && owner.metadata && owner.metadata.team_name;
  const raw = metaName || (owner && owner.display_name) || ('Roster ' + roster.roster_id);
  return {
    rosterId: roster.roster_id,
    team: canonicalTeam(raw),
    manager: (owner && owner.display_name) || '—',
    color: TEAM_COLORS[canonicalTeam(raw)] || '#E8C34A',
    players: (roster.players || []).map(String),
    starters: (roster.starters || []).map(String)
  };
}

function ymd(d){
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  return '' + y + m + day;
}

/* Fantasy weeks roughly Mon–Sun UTC; pull ESPN boards for 7 days around “now”
   plus a few days of history for opp PPG. */
async function loadNbaContext(){
  const today = new Date();
  const dates = [];
  for (let i = -10; i <= 6; i++){
    const d = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() + i));
    dates.push(ymd(d));
  }
  const results = await Promise.all(dates.map(ds =>
    fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + ds)
      .then(r => r.ok ? r.json() : null).catch(() => null)
  ));
  const byTeam = {};
  const ptsFor = {};
  const ptsAgainst = {};
  const gp = {};
  const upcomingCutoff = ymd(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - 1)));

  results.forEach((board, idx) => {
    const ds = dates[idx];
    (board && board.events || []).forEach(ev => {
      const comp = (ev.competitions || [])[0];
      if (!comp) return;
      const comps = comp.competitors || [];
      if (comps.length < 2) return;
      const home = comps.find(c => c.homeAway === 'home') || comps[0];
      const away = comps.find(c => c.homeAway === 'away') || comps[1];
      const hAbbr = home.team && home.team.abbreviation;
      const aAbbr = away.team && away.team.abbreviation;
      if (!hAbbr || !aAbbr) return;
      const status = (comp.status && comp.status.type && comp.status.type.name) || '';
      const final = /FINAL|STATUS_FINAL/i.test(status) || (comp.status && comp.status.type && comp.status.type.completed);
      const hScore = Number(home.score);
      const aScore = Number(away.score);
      if (final && Number.isFinite(hScore) && Number.isFinite(aScore)){
        ptsFor[hAbbr] = (ptsFor[hAbbr] || 0) + hScore;
        ptsAgainst[hAbbr] = (ptsAgainst[hAbbr] || 0) + aScore;
        gp[hAbbr] = (gp[hAbbr] || 0) + 1;
        ptsFor[aAbbr] = (ptsFor[aAbbr] || 0) + aScore;
        ptsAgainst[aAbbr] = (ptsAgainst[aAbbr] || 0) + hScore;
        gp[aAbbr] = (gp[aAbbr] || 0) + 1;
      }
      /* Upcoming / in-window slate for scouting */
      if (ds >= upcomingCutoff){
        (byTeam[hAbbr] = byTeam[hAbbr] || []).push({opp: aAbbr, home: true, date: ds, final: !!final});
        (byTeam[aAbbr] = byTeam[aAbbr] || []).push({opp: hAbbr, home: false, date: ds, final: !!final});
      }
    });
  });

  const oppg = {};
  Object.keys(gp).forEach(t => {
    if (gp[t] > 0) oppg[t] = ptsAgainst[t] / gp[t];
  });
  const vals = Object.values(oppg);
  const avgOppg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 112;
  return {byTeam, oppg, avgOppg, gp};
}

function espnAbbr(sleeperTeam){
  if (!sleeperTeam) return null;
  return SLEEPER_TO_ESPN[String(sleeperTeam).toUpperCase()] || String(sleeperTeam).toUpperCase();
}

function scoutPlayer(pid, dist){
  const p = state.players[pid] || {};
  const team = p.team;
  const espn = espnAbbr(team);
  const nba = state.nbaWeek;
  const games = (espn && nba && nba.byTeam[espn]) || [];
  const upcoming = games.filter(g => !g.final);
  const opps = upcoming.map(g => g.opp);
  const oppLabels = opps.map(o => ESPN_TO_SLEEPER[o] || o);

  const smashRate = dist && dist.smashBoomRate != null ? Number(dist.smashBoomRate)
    : (dist && window.LockInDist && LockInDist.smashBoomRate ? LockInDist.smashBoomRate(dist) : null);
  let lean = 'neutral';
  let leanScore = 0;
  let why = [];

  if (smashRate != null && smashRate >= 0.38){ leanScore += 1; why.push('high smash rate'); }
  if (smashRate != null && smashRate <= 0.22){ leanScore -= 1; why.push('low smash rate'); }

  if (nba && opps.length){
    let envSum = 0, n = 0;
    opps.forEach(o => {
      const oAllowed = nba.oppg[o];
      if (oAllowed != null){
        envSum += (oAllowed - nba.avgOppg) / 6; /* ~6 pts ≈ 1 step */
        n++;
      }
    });
    if (n){
      const env = envSum / n;
      if (env >= 0.45){ leanScore += 1; why.push('soft defensive slate (' + oppLabels.join('/') + ')'); }
      else if (env <= -0.45){ leanScore -= 1; why.push('tough defensive slate (' + oppLabels.join('/') + ')'); }
      else why.push('vs ' + oppLabels.join('/'));
    } else {
      why.push('vs ' + oppLabels.join('/'));
    }
    /* Back-to-back in upcoming window */
    const days = upcoming.map(g => g.date).sort();
    for (let i = 1; i < days.length; i++){
      const a = days[i - 1], b = days[i];
      /* yyyymmdd consecutive */
      const da = Date.UTC(+a.slice(0,4), +a.slice(4,6)-1, +a.slice(6,8));
      const db = Date.UTC(+b.slice(0,4), +b.slice(4,6)-1, +b.slice(6,8));
      if ((db - da) / 86400000 === 1){
        leanScore -= 1;
        why.push('B2B risk');
        break;
      }
    }
  } else if (!team){
    why.push('no NBA team');
    leanScore -= 1;
  }

  const injury = String(p.injury_status || '').toUpperCase();
  if (injury === 'O' || injury === 'OUT' || injury === 'IR'){
    leanScore -= 2;
    why.push(injury === 'IR' ? 'on IR' : 'ruled OUT');
  } else if (injury === 'DTD' || injury === 'Q' || injury === 'QUESTIONABLE'){
    leanScore -= 1;
    why.push('questionable / DTD');
  } else if (injury === 'P' || injury === 'PROBABLE'){
    why.push('probable');
  }

  if (leanScore >= 2) lean = 'smash';
  else if (leanScore <= -2) lean = 'bust';
  else if (leanScore === 1) lean = 'smash';
  else if (leanScore === -1) lean = 'bust';

  return {
    lean: leanScore === 0 ? 'neutral' : lean,
    leanScore,
    why: why.join(' · ') || '—',
    opps: oppLabels,
    smashRate,
    injury: injury || null
  };
}

/* True lock-in nights = green LOCKED only (OCR / manual). Scored starters with
   blue UNLOCKED can still be swapped — never treat API starters_points as locked. */
function lockedPtsFor(pid){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  if (marks[id] && marks[id].pts != null && Number.isFinite(Number(marks[id].pts))){
    return Number(marks[id].pts);
  }
  return null;
}

function weekPtsFor(pid, matchupRow){
  const id = String(pid);
  if (matchupRow && matchupRow.players_points && matchupRow.players_points[id] != null){
    const v = Number(matchupRow.players_points[id]);
    if (Number.isFinite(v)) return v;
  }
  const mark = state.lockMarks && state.lockMarks[id];
  if (mark && mark.pts != null && Number.isFinite(Number(mark.pts))) return Number(mark.pts);
  return null;
}

function isLocked(pid){
  return lockedPtsFor(pid) != null;
}

function slotKeyForPidOnSide(side, pid){
  const id = String(pid);
  const mark = state.lockMarks && state.lockMarks[id];
  if (mark && mark.slot != null && mark.slot !== '') return mark.slot;
  const starters = (side && side.matchup && side.matchup.starters)
    || (side && side.franchise && side.franchise.starters)
    || [];
  const idx = starters.map(String).indexOf(id);
  if (idx >= 0 && idx < lockSlotLabels().length) return idx;
  return 'BN';
}

function sideForPid(pid){
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return null;
  return pair.sides.find(s => (s.franchise.players || []).map(String).includes(String(pid))) || null;
}

function toggleLockMark(pid, weekPts, name, slotKey){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  if (marks[id]){
    delete marks[id];
  } else {
    const pts = weekPts != null && Number.isFinite(Number(weekPts)) ? Number(weekPts) : 0;
    const side = sideForPid(id);
    const slot = slotKey != null ? slotKey : slotKeyForPidOnSide(side, id);
    marks[id] = {pts, source: 'manual', name: name || id, slot};
  }
  saveLockMarks();
  render();
}

function setPlayerSlot(pid, slotKey){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  const side = sideForPid(id);
  const pts = weekPtsFor(id, side && side.matchup);
  if (!marks[id]){
    /* Changing BN → a lock slot banks them into that position. */
    if (slotKey === 'BN') return;
    marks[id] = {
      pts: pts != null && Number.isFinite(Number(pts)) ? Number(pts) : 0,
      source: 'manual',
      name: playerName(state.players[id]),
      slot: slotKey
    };
  } else {
    marks[id].slot = slotKey;
    if (slotKey === 'BN'){
      /* BN means unlocked / not filling a lock slot. */
      delete marks[id];
    }
  }
  saveLockMarks();
  render();
}

function buildPairs(matchupRows, franchisesByRoster){
  const byMid = {};
  (matchupRows || []).forEach(m => {
    if (m.matchup_id == null) return;
    (byMid[m.matchup_id] = byMid[m.matchup_id] || []).push(m);
  });
  return Object.keys(byMid).map(mid => {
    const rows = byMid[mid];
    const sides = rows.map(r => {
      const fr = franchisesByRoster[String(r.roster_id)] || {
        team: 'Roster ' + r.roster_id, color: '#E8C34A', players: [], manager: '—'
      };
      return {
        matchup: r,
        franchise: fr,
        points: Number(r.points) || 0
      };
    });
    while (sides.length < 2){
      sides.push({matchup: null, franchise: {team: 'BYE', color: '#8B93A6', players: []}, points: 0});
    }
    return {id: mid, sides: sides.slice(0, 2)};
  }).sort((a, b) => {
    const an = a.sides.map(s => s.franchise.team).join(' ');
    const bn = b.sides.map(s => s.franchise.team).join(' ');
    return an.localeCompare(bn);
  });
}

function bankOptsForSide(sideDists, lockedScores){
  const slots = (window.LockInDist && LockInDist.LOCK_SLOTS) || 10;
  const left = Math.max(1, slots - (lockedScores || []).length);
  const unlocked = (sideDists || []).filter(d => d && !d._locked);
  const floor = window.LockInDist && LockInDist.rosterBankFloor
    ? LockInDist.rosterBankFloor(unlocked, left)
    : null;
  const week = state.week;
  const seasonWeeks = Number(state.league && state.league.settings && state.league.settings.playoff_week_start) > 1
    ? Number(state.league.settings.playoff_week_start) - 1
    : 21;
  return {
    week,
    seasonWeeks,
    slots: left,
    rosterDists: unlocked,
    rosterFloor: floor,
    dow: (new Date()).getDay(),
    lockedCount: (lockedScores || []).length
  };
}

function sidePlayerRows(side){
  const fr = side.franchise;
  const mrow = side.matchup;
  const starters = (mrow && mrow.starters || fr.starters || []).map(String);
  const starterSet = new Set(starters);
  const labels = lockSlotLabels();
  /* Lineup order: starter slots first (by index), then bench alphabetically / by lock. */
  const starterRows = [];
  for (let i = 0; i < labels.length; i++){
    const id = starters[i];
    if (id && id !== '0' && id !== '') starterRows.push(id);
  }
  const benchIds = (fr.players || []).map(String).filter(id => !starterSet.has(id));
  benchIds.sort((a, b) => {
    const da = state.lockByPid[a] || state.lockByPid[String(a)];
    const db = state.lockByPid[b] || state.lockByPid[String(b)];
    const la = da && (da.lockOvr != null ? da.lockOvr : da.mean);
    const lb = db && (db.lockOvr != null ? db.lockOvr : db.mean);
    return (lb || 0) - (la || 0);
  });
  const pids = starterRows.concat(benchIds);

  const lockedScores = [];
  const distList = [];
  const rows = pids.map(pid => {
    const id = String(pid);
    const p = state.players[id] || {};
    const dist = state.lockByPid[id] ? Object.assign({pid: id}, state.lockByPid[id]) : null;
    const pts = weekPtsFor(id, mrow);
    const lockPts = lockedPtsFor(id);
    const locked = lockPts != null;
    const slot = slotKeyForPidOnSide(side, id);
    const starter = starterSet.has(id);
    if (locked) lockedScores.push(lockPts);
    if (dist){
      dist._locked = locked;
      distList.push(dist);
    }
    const scout = scoutPlayer(id, dist);
    return {
      pid: id, p, dist, pts, lockPts, locked, scout,
      starter, slot, slotLabel: slotDisplayLabel(slot)
    };
  });

  const opts = bankOptsForSide(distList, lockedScores);
  rows.forEach(r => {
    if (!r.dist || !window.LockInDist || typeof LockInDist.lockBankPlan !== 'function'){
      r.bank = null;
      return;
    }
    if (r.locked){
      r.bank = {
        mark: Math.round(r.lockPts != null ? r.lockPts : r.pts),
        rate: 1,
        why: 'Green LOCKED into ' + (r.slotLabel || 'slot'),
        style: 'locked'
      };
      return;
    }
    r.bank = LockInDist.lockBankPlan(r.dist, opts);
  });

  return {
    rows,
    lockedScores,
    opts,
    starters: rows.filter(r => r.starter),
    bench: rows.filter(r => !r.starter)
  };
}

function renderAdvice(pair, leftPack, rightPack){
  const el = document.getElementById('advice');
  if (!pair){ el.innerHTML = ''; return; }
  const focus = state.focusTeam;
  const focusSide = pair.sides.find(s => s.franchise.team === focus) || pair.sides[0];
  const oppSide = pair.sides.find(s => s !== focusSide) || pair.sides[1];
  const focusPack = focusSide === pair.sides[0] ? leftPack : rightPack;
  const oppPack = focusSide === pair.sides[0] ? rightPack : leftPack;

  const tips = [];
  const lockedN = focusPack.lockedScores.length;
  const slots = (window.LockInDist && LockInDist.LOCK_SLOTS) || 10;
  const leftSlots = Math.max(0, slots - lockedN);
  tips.push('<li><span class="tag lock">Banked</span><strong>'
    + escapeHtml(focusSide.franchise.team) + '</strong> has <strong>' + lockedN + '/' + slots
    + '</strong> green <strong>LOCKED</strong> nights'
    + (focusPack.lockedScores.length
      ? (' (' + focusPack.lockedScores.map(x => Math.round(x)).join(', ') + ')')
      : '')
    + '. Blue/cyan <strong>UNLOCKED</strong> can still move. Bench stays <strong>BN</strong> until you set Pos. <strong>'
    + leftSlots + '</strong> slots left'
    + (focusPack.opts.rosterFloor != null
      ? (' · remaining top-' + leftSlots + ' bar ~' + Math.round(focusPack.opts.rosterFloor))
      : '')
    + '. Upload a screenshot or tap a lock pill to sync.</li>');

  const focusPts = focusSide.points;
  const oppPts = oppSide.points;
  const margin = focusPts - oppPts;
  tips.push('<li><span class="tag lock">Scoreboard</span>Live <strong>'
    + Math.round(focusPts) + '</strong>–<strong>' + Math.round(oppPts) + '</strong> vs '
    + escapeHtml(oppSide.franchise.team)
    + (margin > 5 ? ' · you lead — protect locks, don’t force fringe banks.'
      : (margin < -5 ? ' · trailing — hunt smashes; fringe Bank ≥ still applies.'
        : ' · tight — bank quality nights only.'))
    + '</li>');

  const smashCands = focusPack.rows.filter(r => !r.locked && r.scout.lean === 'smash').slice(0, 4);
  if (smashCands.length){
    tips.push('<li><span class="tag smash">Smash lean</span>'
      + smashCands.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong>'
        + (r.bank && r.bank.mark != null ? (' Bank ≥' + r.bank.mark) : '')
        + ' <span style="color:var(--ink-dim)">(' + escapeHtml(r.scout.why) + ')</span>').join(' · ')
      + '.</li>');
  }
  const bustCands = focusPack.rows.filter(r => !r.locked && (r.scout.lean === 'bust' || r.scout.injury)).slice(0, 4);
  if (bustCands.length){
    tips.push('<li><span class="tag bust">Bust / sit</span>'
      + bustCands.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong>'
        + ' <span style="color:var(--ink-dim)">(' + escapeHtml(r.scout.why) + ')</span>').join(' · ')
      + '.</li>');
  }

  const oppSmash = oppPack.rows.filter(r => !r.locked && r.scout.lean === 'smash').slice(0, 3);
  if (oppSmash.length){
    tips.push('<li><span class="tag news">Opp watch</span>'
      + escapeHtml(oppSide.franchise.team) + ' smash leans: '
      + oppSmash.map(r => escapeHtml(playerName(r.p))).join(', ')
      + ' — don’t leave a weak lock slot open if they go off.</li>');
  }

  const newsBits = focusPack.rows.filter(r => r.scout.injury).slice(0, 5);
  if (newsBits.length){
    tips.push('<li><span class="tag news">News</span>'
      + newsBits.map(r => escapeHtml(playerName(r.p)) + ' · ' + escapeHtml(r.scout.injury)
        + (r.p.injury_notes ? (' — ' + escapeHtml(String(r.p.injury_notes).slice(0, 80))) : ''))
        .join(' · ')
      + '.</li>');
  }

  /* Who to bank next among unlocked with bank plan */
  const nextBank = focusPack.rows
    .filter(r => !r.locked && r.bank && r.bank.mark != null && r.starter)
    .sort((a, b) => (b.dist && b.dist.mean || 0) - (a.dist && a.dist.mean || 0))
    .slice(0, 3);
  if (nextBank.length){
    tips.push('<li><span class="tag lock">Lock plan</span>Next Bank ≥ targets: '
      + nextBank.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong> ≥' + r.bank.mark
        + ' <span style="color:var(--ink-dim)">(' + Math.round((r.bank.rate || 0) * 100) + '%)</span>')
        .join(' · ')
      + '. Bars already bake in remaining roster quality + midweek timing.</li>');
  }

  el.innerHTML = '<h2>Advice · ' + escapeHtml(focusSide.franchise.team) + '</h2><ul>' + tips.join('') + '</ul>';
}

function slotBadgeHtml(pid, slotKey){
  const labels = lockSlotLabels();
  const label = slotDisplayLabel(slotKey);
  const cls = slotBadgeClass(label);
  const opts = labels.map((lab, i) => {
    const sel = String(slotKey) === String(i) ? ' selected' : '';
    return '<option value="' + i + '"' + sel + '>' + escapeHtml(lab) + '</option>';
  }).join('');
  const bnSel = (slotKey == null || slotKey === 'BN') ? ' selected' : '';
  return '<select class="slot-badge ' + cls + '" data-slot-pid="' + escapeHtml(String(pid))
    + '" title="Lineup slot (same as Sleeper)">'
    + opts
    + '<option value="BN"' + bnSel + '>BN</option>'
    + '</select>';
}

function playerRowHtml(r){
  const leanCls = r.scout.lean === 'smash' ? 'smash' : (r.scout.lean === 'bust' ? 'bust' : '');
  const leanTxt = r.scout.lean === 'neutral' ? '—' : r.scout.lean;
  const avg = r.dist && r.dist.mean != null ? r.dist.mean.toFixed(1) : '—';
  const smash = r.scout.smashRate != null ? Math.round(r.scout.smashRate * 100) + '%' : '—';
  const bank = r.bank && r.bank.mark != null ? r.bank.mark : '—';
  const pts = r.pts != null ? r.pts : '—';
  const ovr = r.dist && r.dist.lockOvr != null ? Math.round(r.dist.lockOvr) : '—';
  const scored = r.pts != null && Number(r.pts) > 0;
  const pillCls = r.locked ? 'locked' : (scored ? 'open' : 'none');
  const pillTxt = r.locked ? 'Locked' : (scored ? 'Unlocked' : 'Not lock');
  const pillTitle = r.locked
    ? ('Green LOCKED at ' + (r.slotLabel || 'slot') + ' — counts toward lock-in. Click to unmark.')
    : (scored
      ? 'Scored but still UNLOCKED (can sub/move). Click to mark as green LOCKED.'
      : 'No scored night yet. Click to mark locked if needed.');
  const trCls = (r.locked ? 'locked' : '') + (!r.starter ? ' bench' : '');
  const elig = eligHtml(r.p);
  const meta = (r.p.team ? (' · ' + escapeHtml(r.p.team)) : '')
    + (r.scout.opps && r.scout.opps.length ? (' vs ' + escapeHtml(r.scout.opps.join('/'))) : '')
    + (r.scout.injury ? (' · ' + escapeHtml(r.scout.injury)) : '');
  return '<tr class="' + trCls.trim() + '">'
    + '<td class="player"><div class="player-row"><div class="player-main">'
    + escapeHtml(playerName(r.p))
    + '<button type="button" class="lock-pill ' + pillCls + '" data-lock-pid="' + escapeHtml(r.pid)
    + '" data-lock-pts="' + (r.pts != null ? r.pts : '') + '" data-lock-slot="'
    + escapeHtml(String(r.slot == null ? 'BN' : r.slot)) + '" title="' + escapeHtml(pillTitle) + '">'
    + pillTxt + '</button>'
    + '<span class="sub">' + elig + meta + '</span>'
    + '</div>' + slotBadgeHtml(r.pid, r.slot) + '</div></td>'
    + '<td class="num">' + ovr + '</td>'
    + '<td class="num">' + avg + '</td>'
    + '<td class="num">' + smash + '</td>'
    + '<td class="num" title="' + escapeHtml((r.bank && r.bank.why) || '') + '">' + bank + '</td>'
    + '<td class="num">' + pts + '</td>'
    + '<td class="lean ' + leanCls + '" title="' + escapeHtml(r.scout.why) + '">' + leanTxt + '</td>'
    + '</tr>';
}

function renderSide(side, pack){
  const fr = side.franchise;
  const starters = pack.starters || [];
  const bench = pack.bench || [];
  const body = []
    .concat(starters.length ? ['<tr class="section-row"><td colspan="7">Starters</td></tr>'] : [])
    .concat(starters.map(playerRowHtml))
    .concat(bench.length ? ['<tr class="section-row"><td colspan="7">Bench</td></tr>'] : [])
    .concat(bench.map(playerRowHtml))
    .join('');

  const lockedN = pack.lockedScores.length;
  const slots = lockSlotLabels().length;
  return '<div class="side" style="--team-color:' + escapeHtml(fr.color) + '">'
    + '<div class="side-head"><h3>' + escapeHtml(fr.team) + '</h3>'
    + '<span class="pts">' + Math.round(side.points) + ' FP · '
    + lockedN + '/' + slots + ' locked</span></div>'
    + '<table><thead><tr>'
    + '<th>Player</th><th class="num">Lock</th><th class="num">Avg</th><th class="num">Smash</th>'
    + '<th class="num">Bank ≥</th><th class="num">Wk</th><th>Lean</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function render(){
  const slate = document.getElementById('slate');
  slate.innerHTML = state.pairs.map(pair => {
    const a = pair.sides[0], b = pair.sides[1];
    const active = state.selectedPair && String(state.selectedPair.id) === String(pair.id);
    return '<button type="button" class="mu-card' + (active ? ' active' : '') + '" data-mid="' + pair.id + '">'
      + '<p class="vs">' + escapeHtml(a.franchise.team) + ' <span style="color:var(--ink-dim)">vs</span> '
      + escapeHtml(b.franchise.team) + '</p>'
      + '<p class="score">' + Math.round(a.points) + ' — ' + Math.round(b.points) + '</p>'
      + '<p class="sub">Matchup ' + pair.id + '</p>'
      + '</button>';
  }).join('');
  slate.querySelectorAll('.mu-card').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedPair = state.pairs.find(p => String(p.id) === String(btn.dataset.mid));
      render();
    });
  });

  const pair = state.selectedPair || state.pairs[0];
  state.selectedPair = pair;
  if (!pair){
    document.getElementById('detailTitle').textContent = 'No matchups';
    document.getElementById('sides').innerHTML = '';
    document.getElementById('advice').innerHTML = '';
    return;
  }

  const leftPack = sidePlayerRows(pair.sides[0]);
  const rightPack = sidePlayerRows(pair.sides[1]);
  document.getElementById('detailTitle').textContent =
    pair.sides[0].franchise.team + ' vs ' + pair.sides[1].franchise.team;
  document.getElementById('detailSub').textContent =
    'Week ' + state.week + ' · lineup slots PG–UTIL + BN bench · Bank ≥ after green locks only';
  document.getElementById('sides').innerHTML =
    renderSide(pair.sides[0], leftPack) + renderSide(pair.sides[1], rightPack);
  renderAdvice(pair, leftPack, rightPack);

  document.getElementById('footNote').textContent =
    'Green LOCKED = banked into a lineup slot (PG/SG/G/SF/PF/F/C/UTIL). Bench shows BN until you change the Pos menu. '
    + 'Screenshot OCR only matches the two teams in this matchup — never invents outside players. '
    + 'Cyan open-lock “LOCK-IN” = still unlocked. Smash/bust leans blend smash rate, ESPN slate, B2B, and injury tags.';

  document.querySelectorAll('[data-lock-pid]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();
      const pid = btn.getAttribute('data-lock-pid');
      const ptsRaw = btn.getAttribute('data-lock-pts');
      const pts = ptsRaw === '' || ptsRaw == null ? null : Number(ptsRaw);
      const slotRaw = btn.getAttribute('data-lock-slot');
      const slot = slotRaw === '' || slotRaw == null ? 'BN'
        : (slotRaw === 'BN' ? 'BN' : Number(slotRaw));
      const p = state.players[pid] || {};
      toggleLockMark(pid, pts, playerName(p), slot);
    });
  });
  document.querySelectorAll('[data-slot-pid]').forEach(sel => {
    sel.addEventListener('change', () => {
      const pid = sel.getAttribute('data-slot-pid');
      const raw = sel.value;
      const slot = raw === 'BN' ? 'BN' : Number(raw);
      setPlayerSlot(pid, slot);
    });
  });
}

async function loadMatchups(week){
  progress(55, 'Loading matchups…');
  const rows = await fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/matchups/' + week)
    .then(r => r.ok ? r.json() : []).catch(() => []);
  state.week = week;
  loadLockMarks();
  state.matchups = rows || [];
  const franchisesByRoster = {};
  state.rosters.forEach(r => {
    franchisesByRoster[String(r.roster_id)] = franchiseOfRoster(r);
  });
  state.pairs = buildPairs(state.matchups, franchisesByRoster);
  /* Prefer focus team's matchup */
  const mine = state.pairs.find(p => p.sides.some(s => s.franchise.team === state.focusTeam));
  state.selectedPair = mine || state.pairs[0] || null;
  render();
}

function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (state.tesseractLoading) return state.tesseractLoading;
  const urls = [
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
  ];
  state.tesseractLoading = (async () => {
    let lastErr = null;
    for (let i = 0; i < urls.length; i++){
      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = urls[i];
          s.async = true;
          s.onload = () => window.Tesseract ? resolve() : reject(new Error('Tesseract missing'));
          s.onerror = () => reject(new Error('CDN fail ' + urls[i]));
          document.head.appendChild(s);
        });
        return window.Tesseract;
      } catch (e){ lastErr = e; }
    }
    state.tesseractLoading = null;
    throw lastErr || new Error('Could not load OCR library');
  })();
  return state.tesseractLoading;
}

/* Color canvas of the left roster column — used for green vs cyan lock badges. */
function prepColorCanvas(img, opts){
  const options = opts || {};
  const leftOnly = options.leftOnly !== false;
  let sw = img.naturalWidth || img.width;
  let sh = img.naturalHeight || img.height;
  const srcW = leftOnly ? Math.max(1, Math.floor(sw * 0.55)) : sw;
  /* Cap tall Sleeper scrolls so badge scan stays responsive. */
  const maxH = options.maxH || 14000;
  const maxW = options.maxW || 900;
  const scale = Math.min(1, maxW / srcW, maxH / sh);
  const w = Math.max(1, Math.round(srcW * scale));
  const h = Math.max(1, Math.round(sh * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(img, 0, 0, srcW, sh, 0, 0, w, h);
  return {canvas, scale, srcW, sh};
}

/* Soft invert for dark Sleeper UI — name OCR only (not badge color). */
function prepCanvasForOcr(img, opts){
  const options = opts || {};
  const maxSide = options.maxSide || 2400;
  const leftOnly = !!options.leftOnly;
  let sw = img.naturalWidth || img.width;
  let sh = img.naturalHeight || img.height;
  const srcW = leftOnly ? Math.max(1, Math.floor(sw * 0.55)) : sw;
  const scale = Math.min(1, maxSide / Math.max(srcW, sh));
  const minW = leftOnly ? 900 : 1100;
  const boost = srcW * scale < minW ? (minW / srcW) : scale;
  const w = Math.max(1, Math.round(srcW * boost));
  const h = Math.max(1, Math.round(sh * boost));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, srcW, sh, 0, 0, w, h);
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;
  let sum = 0, step = 20;
  for (let i = 0; i < d.length; i += 4 * step) sum += (d[i] + d[i+1] + d[i+2]) / 3;
  const avg = sum / Math.max(1, Math.floor(d.length / (4 * step)));
  if (avg < 120){
    const contrast = 1.35;
    for (let i = 0; i < d.length; i += 4){
      let r = 255 - d[i], g = 255 - d[i+1], b = 255 - d[i+2];
      r = Math.min(255, Math.max(0, (r - 128) * contrast + 128));
      g = Math.min(255, Math.max(0, (g - 128) * contrast + 128));
      b = Math.min(255, Math.max(0, (b - 128) * contrast + 128));
      const y = 0.299 * r + 0.587 * g + 0.114 * b;
      const v = y > 155 ? 255 : (y < 75 ? 0 : y);
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  return canvas;
}

function canvasToBlob(canvas){
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) reject(new Error('Could not prepare image'));
      else resolve(blob);
    }, 'image/png');
  });
}

function loadShotImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const color = prepColorCanvas(img, {leftOnly: true});
        const ocrLeft = prepCanvasForOcr(img, {leftOnly: true});
        URL.revokeObjectURL(url);
        resolve({img, color, ocrLeft});
      } catch (e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}

/* Only the two fantasy teams in the selected matchup — never the whole NBA pool. */
function matchupRosterPids(){
  const set = new Set();
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return set;
  pair.sides.forEach(side => {
    (side.franchise.players || []).forEach(id => set.add(String(id)));
  });
  return set;
}

function buildNameIndex(onlyPids){
  const allow = onlyPids || null;
  const idx = [];
  const pids = allow ? Array.from(allow) : Object.keys(state.players);
  pids.forEach(pid => {
    const id = String(pid);
    if (allow && !allow.has(id)) return;
    const p = state.players[id];
    if (!p || id.indexOf('TEAM_') === 0) return;
    const name = playerName(p);
    const key = normalizeName(name);
    if (key.length < 4) return;
    const last = normalizeName(p.last_name || name.split(' ').slice(-1)[0]);
    const first = normalizeName(p.first_name || name.split(' ')[0] || '');
    const abbr = first ? (first.charAt(0) + last) : '';
    idx.push({pid: id, name, key, last, abbr});
  });
  return idx;
}

function editDist(a, b){
  const s = String(a || ''), t = String(b || '');
  if (s === t) return 0;
  if (!s.length) return t.length;
  if (!t.length) return s.length;
  const row = Array.from({length: t.length + 1}, (_, i) => i);
  for (let i = 0; i < s.length; i++){
    let prev = i, next = i + 1;
    for (let j = 0; j < t.length; j++){
      const cur = s.charAt(i) === t.charAt(j) ? prev : Math.min(prev, row[j + 1], next) + 1;
      prev = row[j + 1];
      row[j + 1] = cur;
      next = cur;
    }
  }
  return row[t.length];
}

function softNorm(s){
  /* Keep spaces so “K Wagler” stays tokenizable after OCR cleanup. */
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[.\u2019']/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
}

function matchPlayerOnLine(lnOrRaw, idx){
  const ln = normalizeName(lnOrRaw);
  const soft = softNorm(lnOrRaw);
  const words = soft.split(/\s+/).filter(w => w.length >= 3);
  let best = null, bestScore = 99;
  idx.forEach(f => {
    let score = 99;
    if (ln.indexOf(f.key) >= 0) score = 0;
    else if (f.abbr && f.abbr.length >= 4 && ln.indexOf(f.abbr) >= 0) score = 1;
    else if (f.last.length >= 4 && ln.indexOf(f.last) >= 0) score = 2;
    else if (f.last.length >= 4){
      /* OCR typos within the matchup roster only. */
      words.forEach(w => {
        if (Math.abs(w.length - f.last.length) > 2) return;
        const d = editDist(w, f.last);
        if (d <= 2) score = Math.min(score, 3 + d);
      });
    }
    if (score < bestScore){ bestScore = score; best = f; }
  });
  return bestScore <= 5 ? best : null;
}

function focusRosterPids(){
  /* Prefer the focused franchise when both sides are in the pool. */
  const set = new Set();
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return set;
  const side = pair.sides.find(s => s.franchise.team === state.focusTeam) || pair.sides[0];
  (side && side.franchise.players || []).forEach(id => set.add(String(id)));
  return set;
}

function ptsForMatchedPlayer(pid){
  const pair = state.selectedPair || state.pairs[0];
  const side = pair && pair.sides.find(s => (s.franchise.players || []).map(String).includes(String(pid)));
  return weekPtsFor(pid, side && side.matchup);
}

/* Sleeper: cyan open-lock + “LOCK-IN” label = still unlocked.
   Green closed-lock badge near a scored night = actually banked. Never treat
   LOCK-IN text alone as locked — OCR reads that label on unlocked rows too. */
function rgbToHsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return {h, s: max ? d / max : 0, v: max};
}

function classifyLockPixel(r, g, b){
  const {h, s, v} = rgbToHsv(r, g, b);
  if (v < 0.35 || s < 0.4) return null;
  /* True green locked — exclude cyan/teal unlocked buttons. */
  if (h >= 95 && h <= 145 && g > r + 20 && g > b + 10) return 'green';
  if (h >= 155 && h <= 205 && g > r + 15 && b > r + 15) return 'cyan';
  return null;
}

function findGreenLockBadges(canvas){
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  const w = canvas.width, h = canvas.height;
  const {data} = ctx.getImageData(0, 0, w, h);
  const step = 4, rad = 30;
  const x0 = Math.floor(w * 0.04), x1 = Math.floor(w * 0.95);
  const peaks = [];
  for (let y = Math.min(400, Math.floor(h * 0.04)); y < h - 40; y += step){
    for (let x = x0; x < x1; x += step){
      let gN = 0, cN = 0;
      for (let dy = -rad; dy <= rad; dy += 2){
        for (let dx = -rad; dx <= rad; dx += 2){
          if (dx * dx + dy * dy > rad * rad) continue;
          const yy = y + dy, xx = x + dx;
          if (yy < 0 || xx < 0 || yy >= h || xx >= w) continue;
          const i = (yy * w + xx) * 4;
          const k = classifyLockPixel(data[i], data[i + 1], data[i + 2]);
          if (k === 'green') gN++;
          else if (k === 'cyan') cN++;
        }
      }
      /* Large LOCK-IN buttons ~500–600; skip green “W” glyphs (~95). */
      if (gN < 180 || gN <= cN * 1.25) continue;
      peaks.push({x, y, gN, cN, score: gN});
    }
  }
  peaks.sort((a, b) => b.score - a.score);
  const kept = [];
  peaks.forEach(p => {
    if (kept.some(k => Math.hypot(k.x - p.x, k.y - p.y) < 60)) return;
    kept.push(p);
  });
  return kept.sort((a, b) => a.y - b.y);
}

function matchGreenBadgesToPlayers(badges, ocrWords){
  const rosterPids = matchupRosterPids();
  const focusPids = focusRosterPids();
  /* Index ONLY matchup roster players — never guess from the full NBA pool. */
  const focusIdx = buildNameIndex(focusPids.size ? focusPids : rosterPids);
  const bothIdx = buildNameIndex(rosterPids);
  const hits = [];
  const seen = {};
  const words = (ocrWords || []).filter(w =>
    w && w.confidence >= 40 && /[A-Za-z]{3,}/.test(String(w.text || ''))
  ).map(w => ({
    t: String(w.text || ''),
    y: w.bbox ? w.bbox.y0 : 0,
    y1: w.bbox ? w.bbox.y1 : 0,
    x: w.bbox ? w.bbox.x0 : 0
  }));

  badges.forEach(b => {
    const by = b.y;
    const above = words
      .filter(n => n.y < by && by - n.y < 350 && by - n.y > 10)
      .sort((a, c) => c.y - a.y)
      .slice(0, 12);
    const nearText = above.slice(0, 6).map(n => n.t).join(' ');
    /* Focus team first (left column of the SC), then the opponent roster only. */
    let match = matchPlayerOnLine(nearText, focusIdx);
    if (!match) match = matchPlayerOnLine(nearText, bothIdx);
    if (!match || !rosterPids.has(String(match.pid)) || seen[match.pid]) return;

    const side = sideForPid(match.pid);
    const slot = slotKeyForPidOnSide(side, match.pid);
    let pts = ptsForMatchedPlayer(match.pid);
    if (pts == null || !Number.isFinite(pts)){
      const nums = nearText.match(/\b(\d{1,3}(?:\.\d{1,2})?)\b/g) || [];
      const ptsCand = nums.map(Number).filter(n => n >= 5 && n <= 90);
      if (ptsCand.length) pts = ptsCand[ptsCand.length - 1];
    }
    if (pts == null || !Number.isFinite(pts)) return;
    seen[match.pid] = 1;
    hits.push({
      pid: match.pid,
      name: match.name,
      pts: Number(pts),
      slot,
      slotLabel: slotDisplayLabel(slot)
    });
  });
  return hits;
}

async function ocrWordsFromCanvas(worker, canvas, psm){
  await worker.setParameters({tessedit_pageseg_mode: String(psm)});
  const blob = await canvasToBlob(canvas);
  const {data} = await worker.recognize(blob);
  return data;
}

async function runOcrOnImage(file){
  const status = document.getElementById('shotStatus');
  const preview = document.getElementById('shotPreview');
  status.className = 'shot-status';
  status.textContent = 'Reading screenshot for green lock badges…';
  preview.hidden = false;
  preview.src = URL.createObjectURL(file);
  try {
    await loadTesseract();
    const packs = await loadShotImage(file);
    status.textContent = 'Scanning green vs cyan lock badges…';
    const greenBadges = findGreenLockBadges(packs.color.canvas);

    const worker = await Tesseract.createWorker('eng');
    let words = [];
    let textSample = '';
    try {
      status.textContent = 'Matching badge rows to roster names…';
      const pass1 = await ocrWordsFromCanvas(worker, packs.ocrLeft, 6);
      words = pass1.words || [];
      textSample = pass1.text || '';
      if (!words.length){
        const pass2 = await ocrWordsFromCanvas(worker, packs.ocrLeft, 4);
        words = pass2.words || [];
        textSample = (textSample + '\n' + (pass2.text || '')).trim();
      }
    } finally {
      await worker.terminate();
    }

    /* Scale OCR word Y into color-canvas space when heights differ. */
    const ocrH = packs.ocrLeft.height || 1;
    const colorH = packs.color.canvas.height || 1;
    const yScale = colorH / ocrH;
    const scaledWords = words.map(w => ({
      text: w.text,
      confidence: w.confidence,
      bbox: w.bbox ? {
        x0: w.bbox.x0 * (packs.color.canvas.width / (packs.ocrLeft.width || 1)),
        y0: w.bbox.y0 * yScale,
        x1: w.bbox.x1 * (packs.color.canvas.width / (packs.ocrLeft.width || 1)),
        y1: w.bbox.y1 * yScale
      } : null
    }));

    /* Drop prior OCR marks before slot lookup so positions come from the live lineup. */
    Object.keys(state.lockMarks || {}).forEach(pid => {
      if (state.lockMarks[pid] && state.lockMarks[pid].source === 'ocr'){
        delete state.lockMarks[pid];
      }
    });
    const hits = matchGreenBadgesToPlayers(greenBadges, scaledWords);
    hits.forEach(h => {
      state.lockMarks[h.pid] = {
        pts: h.pts,
        source: 'ocr',
        name: h.name,
        slot: h.slot == null ? 'BN' : h.slot
      };
    });
    saveLockMarks();
    document.getElementById('shotClear').hidden = false;
    const rosterN = matchupRosterPids().size;
    if (!hits.length){
      status.className = 'shot-status';
      status.textContent = greenBadges.length
        ? ('Found ' + greenBadges.length + ' green badge(s) but none matched the '
          + rosterN + ' rostered players in this matchup. Tap lock pills on green-locked rows.')
        : 'No green locked badges in that shot (cyan “LOCK-IN” = still unlocked). Matched only against this matchup’s rosters ('
          + rosterN + ' players).';
      console.warn('matchup green badges', greenBadges.length, 'roster pool', rosterN, 'ocr sample', textSample.slice(0, 600));
      render();
    } else {
      status.className = 'shot-status ok';
      status.textContent = 'Green LOCKED from screenshot: '
        + hits.map(h => h.name + ' @' + (h.slotLabel || slotDisplayLabel(h.slot)) + ' ' + h.pts).join(', ');
      render();
    }
  } catch (e){
    status.className = 'shot-status err';
    status.textContent = 'OCR failed: ' + (e.message || e)
      + '. You can still tap lock pills on each starter.';
  }
}

function bindShotUi(){
  const file = document.getElementById('shotFile');
  document.getElementById('shotPick').addEventListener('click', () => file.click());
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if (f) runOcrOnImage(f);
  });
  document.getElementById('shotPaste').addEventListener('click', async () => {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items){
        const type = item.types.find(t => t.startsWith('image/'));
        if (!type) continue;
        const blob = await item.getType(type);
        await runOcrOnImage(new File([blob], 'paste.png', {type}));
        return;
      }
      document.getElementById('shotStatus').textContent = 'No image on clipboard.';
    } catch (e){
      document.getElementById('shotStatus').textContent = 'Clipboard paste blocked — use Choose image.';
    }
  });
  document.getElementById('shotClear').addEventListener('click', () => {
    state.lockMarks = {};
    saveLockMarks();
    document.getElementById('shotPreview').hidden = true;
    document.getElementById('shotClear').hidden = true;
    document.getElementById('shotStatus').className = 'shot-status';
    document.getElementById('shotStatus').textContent = 'Lock marks cleared for this week.';
    render();
  });
}

async function load(){
  const status = document.getElementById('status');
  const tag = document.getElementById('tag');
  try {
    progress(5, 'Loading league…');
    const share = window.PatioBoysShare;
    const [league, users, rosters, players] = await Promise.all([
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID).then(r => r.json()),
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/users').then(r => r.json()),
      fetch('https://api.sleeper.app/v1/league/' + LEAGUE_ID + '/rosters').then(r => r.json()),
      (window.PatioBoysShare && typeof PatioBoysShare.fetchPlayersNba === 'function')
        ? PatioBoysShare.fetchPlayersNba()
        : fetch('https://api.sleeper.app/v1/players/nba').then(r => r.json())
    ]);
    state.league = league;
    state.users = users || [];
    state.rosters = rosters || [];
    state.players = players || {};

    const week = Number(league.settings && league.settings.leg) || 1;
    const playoff = Number(league.settings && league.settings.playoff_week_start) || 22;
    state.maxWeek = Math.max(week, playoff - 1, 18);
    state.week = week;
    state.focusTeam = MY_TEAM;

    progress(25, 'Loading dynasty curves…');
    let statsSeason = league.season;
    try {
      /* Prefer completed smash season when current has thin samples */
      const prev = String(Number(league.season) - 1);
      statsSeason = prev;
    } catch (e) { /* keep */ }
    state.statsSeason = statsSeason;

    if (window.LockInDist && typeof LockInDist.fetchLockValueIndex === 'function'){
      const rosterIds = [];
      state.rosters.forEach(r => (r.players || []).forEach(id => rosterIds.push(String(id))));
      const pack = await LockInDist.fetchLockValueIndex({
        scoring: league.scoring_settings,
        statsSeason,
        playerDb: state.players,
        playerIds: rosterIds,
        twoKSnapshot: window.TWO_K_SNAPSHOT || null
      });
      state.lockByPid = pack.distMap || {};
      if (pack.statsSeason) state.statsSeason = pack.statsSeason;
    }

    progress(60, 'Loading NBA slate…');
    try {
      state.nbaWeek = await loadNbaContext();
    } catch (e){
      state.nbaWeek = {byTeam: {}, oppg: {}, avgOppg: 112, gp: {}};
    }

    /* Week + focus selects */
    const weekSel = document.getElementById('weekSel');
    weekSel.innerHTML = '';
    for (let w = 1; w <= state.maxWeek; w++){
      const opt = document.createElement('option');
      opt.value = w; opt.textContent = 'Week ' + w;
      if (w === state.week) opt.selected = true;
      weekSel.appendChild(opt);
    }
    weekSel.addEventListener('change', () => loadMatchups(Number(weekSel.value)));

    const focus = document.getElementById('focusTeam');
    const teamNames = state.rosters.map(r => franchiseOfRoster(r).team)
      .filter((t, i, a) => a.indexOf(t) === i).sort();
    focus.innerHTML = teamNames.map(t =>
      '<option value="' + escapeHtml(t) + '"' + (t === state.focusTeam ? ' selected' : '') + '>'
      + escapeHtml(t) + '</option>').join('');
    focus.addEventListener('change', () => {
      state.focusTeam = focus.value;
      const mine = state.pairs.find(p => p.sides.some(s => s.franchise.team === state.focusTeam));
      if (mine) state.selectedPair = mine;
      render();
    });
    document.getElementById('refreshBtn').addEventListener('click', () => loadMatchups(state.week));
    bindShotUi();

    await loadMatchups(state.week);

    document.getElementById('app').hidden = false;
    status.classList.remove('error');
    status.textContent = 'Week ' + state.week + ' · '
      + state.pairs.length + ' matchups · smash season ' + (state.statsSeason || '—')
      + ' · ESPN slate ' + (state.nbaWeek && Object.keys(state.nbaWeek.byTeam).length
        ? Object.keys(state.nbaWeek.byTeam).length + ' teams'
        : 'unavailable');
    tag.textContent = state.pairs.length + ' games';
    progress(100, 'Ready');
    if (window.PatioBoysLoader) PatioBoysLoader.signalReady({page: 'matchups'});
  } catch (e){
    status.classList.add('error');
    status.textContent = 'Could not load matchups: ' + (e.message || e);
    tag.textContent = 'Error';
    console.error('matchups load failed', e);
    if (window.PatioBoysLoader) PatioBoysLoader.signalReady({page: 'matchups', error: true});
  }
}

load();
