<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patio Boys — Matchups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="hq-loader.js"></script>
<style>
  :root{
    --bg:#0F131B; --surface:#171D28; --surface-2:#1F2735;
    --ink:#ECEEF3; --ink-dim:#8B93A6; --hairline:#2E3645;
    --gold:#E8C34A; --coral:#D8553A; --green:#1D9E75;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 48px}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0;border-bottom:1px solid var(--hairline);
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px}
  .topbar .brand .gm{font-family:'Anton',sans-serif;font-size:18px;color:var(--ink);letter-spacing:.04em}
  .topbar .brand .gm em{color:var(--gold);font-style:normal}
  body.embed .topbar{padding:10px 0}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:16px 0 0}
  .status.error{color:var(--coral)}

  .controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
    margin:16px 0 12px;padding-bottom:14px;border-bottom:1px solid var(--hairline);
  }
  .field{display:flex;flex-direction:column;gap:5px;min-width:120px}
  .field label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.08em;text-transform:uppercase;
  }
  .field select,.field input,.btn{
    background:var(--surface);border:1px solid var(--hairline);border-radius:6px;
    color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;
  }
  .btn{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:color-mix(in srgb, var(--gold) 18%, var(--surface));border-color:var(--gold);color:var(--gold)}

  .slate{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0 18px}
  .mu-card{
    border:1px solid var(--hairline);border-radius:8px;padding:12px 14px;background:var(--surface);
    cursor:pointer;text-align:left;color:inherit;width:100%;
  }
  .mu-card:hover{border-color:var(--ink-dim)}
  .mu-card.active{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 10%, var(--surface))}
  .mu-card .vs{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:16px;margin:0;line-height:1.15;
  }
  .mu-card .score{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin:8px 0 0;
  }
  .mu-card .sub{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;margin:6px 0 0;
  }

  .report-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:8px 0 12px;
  }
  .report-head h1{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;margin:0;letter-spacing:.03em;
  }
  .report-head p{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;margin:0;
  }

  .advice{
    border:1px solid var(--hairline);border-radius:8px;padding:14px 16px;background:var(--surface);
    margin-bottom:16px;
  }
  .advice h2{
    font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0 0 8px;letter-spacing:.03em;
  }
  .advice ul{margin:0;padding-left:18px}
  .advice li{margin:0 0 8px;font-size:14px;color:#C9CDD8}
  .advice li strong{color:var(--ink)}
  .advice .tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px;
  }
  .tag.smash{background:color-mix(in srgb, var(--green) 22%, transparent);color:var(--green)}
  .tag.bust{background:color-mix(in srgb, var(--coral) 22%, transparent);color:var(--coral)}
  .tag.lock{background:color-mix(in srgb, var(--gold) 22%, transparent);color:var(--gold)}
  .tag.news{background:color-mix(in srgb, #3A8FC9 22%, transparent);color:#7EB6E0}

  .shot{
    border:1px dashed var(--hairline);border-radius:8px;padding:12px 14px;background:var(--surface-2);
    margin-bottom:16px;
  }
  .shot-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .shot-preview{margin-top:10px;max-width:280px;border-radius:6px;border:1px solid var(--hairline)}
  .shot-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin:8px 0 0}
  .shot-status.ok{color:var(--green)}
  .shot-status.err{color:var(--coral)}

  .sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:820px){.sides{grid-template-columns:1fr}}
  .side{
    border:1px solid var(--hairline);border-radius:8px;overflow:hidden;background:var(--surface);
    border-top:3px solid var(--team-color, var(--gold));
  }
  .side-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:10px 12px;background:var(--surface-2);
  }
  .side-head h3{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:0}
  .side-head .pts{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--gold)}
  table{width:100%;border-collapse:collapse}
  th,td{
    text-align:left;padding:8px 10px;
    border-bottom:1px solid color-mix(in srgb, var(--hairline) 80%, transparent);
    font-size:13px;vertical-align:top;
  }
  th{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink-dim);
    letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);
  }
  td.player{font-weight:600}
  td.player .sub{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
    color:var(--ink-dim);margin-top:2px;
  }
  td.player .slate{
    display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center;
  }
  td.player .fp-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    padding:1px 5px;border-radius:4px;line-height:1.35;
    color:var(--gold);background:color-mix(in srgb, var(--gold) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  }
  /* Locked-in game score — white so it stands apart from raw FP chips. */
  td.player .fp-chip.lock{
    color:#fff;background:color-mix(in srgb, #fff 14%, transparent);
    border-color:color-mix(in srgb, #fff 45%, transparent);
  }
  td.player .opp-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
    color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;
  }
  td.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--gold)}
  td.num.lock-score{color:#fff}
  td.lean.smash{color:var(--green);font-weight:600}
  td.lean.bust{color:var(--coral);font-weight:600}
  td.rec{font-size:12px;line-height:1.35;min-width:7.5rem}
  td.rec .rec-act{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;
  }
  td.rec .rec-why{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;
    color:var(--ink-dim);margin-top:2px;
  }
  td.rec.rec-lock .rec-act{color:var(--green)}
  td.rec.rec-switch .rec-act{color:var(--coral)}
  td.rec.rec-wait .rec-act{color:var(--gold)}
  td.rec.rec-sit .rec-act, td.rec.rec-none .rec-act{color:var(--ink-dim)}
  td.rec.rec-locked .rec-act{color:#fff}
  tr.locked td{background:color-mix(in srgb, var(--green) 10%, transparent)}
  .lock-pill{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;
    margin-left:6px;vertical-align:middle;border:1px solid transparent;cursor:pointer;
  }
  .lock-pill.locked{color:#0b2; border-color:var(--green); background:color-mix(in srgb, var(--green) 18%, transparent)}
  .lock-pill.open{color:#6ec8ff; border-color:#3A8FC9; background:color-mix(in srgb, #3A8FC9 14%, transparent)}
  .lock-pill.none{color:var(--ink-dim); border-color:var(--hairline)}
  .lock-pill:hover{filter:brightness(1.15)}
  /* Sleeper-style lineup: name left, slot badge right */
  .player-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .player-main{min-width:0;flex:1}
  tr.bench td.player .player-main{font-weight:500;color:var(--ink-dim)}
  .slot-badge{
    -webkit-appearance:none;appearance:none;flex:0 0 auto;align-self:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;text-align:center;
    border:none;border-radius:6px;padding:5px 8px;min-width:2.75rem;cursor:pointer;
    line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .slot-badge:focus{outline:1px solid var(--gold)}
  .slot-badge.pg{background:#2E3A66;color:#F0718A}
  .slot-badge.sg{background:#2E3A66;color:#F5A15C}
  .slot-badge.sf{background:#2E3A66;color:#E8C34A}
  .slot-badge.pf{background:#2E3A66;color:#6EC8FF}
  .slot-badge.c{background:#2E3A66;color:#B8A4FF}
  .slot-badge.g{
    background:linear-gradient(90deg,#FD6483 0%,#FD6483 70%,#FF8A4C 100%);
    color:#14080c;
  }
  .slot-badge.f{
    background:linear-gradient(90deg,#7ED9B0 0%,#7ED9B0 65%,#52B8E5 100%);
    color:#0a1a14;
  }
  .slot-badge.util{background:#8B64FB;color:#160c2e}
  .slot-badge.bn{background:#3B4364;color:#9AA3BD}
  .elig{font-weight:600}
  .elig.pg{color:#F0718A}.elig.sg{color:#F5A15C}.elig.sf{color:#E8C34A}
  .elig.pf{color:#6EC8FF}.elig.c{color:#B8A4FF}.elig.g{color:#FD6483}.elig.f{color:#7ED9B0}
  tr.section-row td{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
    background:var(--surface-2);padding:6px 10px;border-bottom:1px solid var(--hairline);
  }
  .foot{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
    margin:14px 0 0;line-height:1.55;
  }
</style>
</head>

<script>
const LEAGUE_ID = '1350649177381552128';
const MY_TEAM = 'Freakonomics';
const TEAM_COLORS = {
  'Funeral Home':'#C9963A','BoobieDominguez':'#1D9E75','2011-12 Champs':'#D8553A',
  'Freakonomics':'#7F77DD','Papa Book':'#D4537E','Bam Add the Mayo':'#3A8FC9',
  'Hamas':'#9B59B6','Belt':'#5DBB63'
};
const TEAM_ALIASES = {
  '20112012champs':'2011-12 Champs',
  '20112012champ':'2011-12 Champs',
  'thehitmanharts':'BoobieDominguez',
  'badgersretirementhome':'Funeral Home',
  'belt':'Belt'
};
/* Sleeper abbr → ESPN scoreboard abbr */
const SLEEPER_TO_ESPN = {
  ATL:'ATL', BKN:'BKN', BOS:'BOS', CHA:'CHA', CHI:'CHI', CLE:'CLE', DAL:'DAL', DEN:'DEN',
  DET:'DET', GSW:'GS', HOU:'HOU', IND:'IND', LAC:'LAC', LAL:'LAL', MEM:'MEM', MIA:'MIA',
  MIL:'MIL', MIN:'MIN', NOP:'NO', NYK:'NY', OKC:'OKC', ORL:'ORL', PHI:'PHI', PHX:'PHX',
  POR:'POR', SAC:'SAC', SAS:'SA', TOR:'TOR', UTA:'UTAH', WAS:'WSH'
};
const ESPN_TO_SLEEPER = Object.fromEntries(Object.entries(SLEEPER_TO_ESPN).map(([a,b]) => [b, a]));

const state = {
  league: null,
  users: [],
  rosters: [],
  players: {},
  week: null,
  maxWeek: 21,
  matchups: [],
  pairs: [],
  selectedPair: null,
  focusTeam: MY_TEAM,
  lockByPid: {},
  statsSeason: null,
  nbaWeek: null, /* { byTeam, oppg, avgOppg, finalEvents } from ESPN slate */
  /* pid -> [{eventId, date, opp, fp}] scored box scores for played games. */
  gameFpByPid: {},
  /* Only green LOCKED nights — never inferred from “starter with points”. */
  lockMarks: {}, /* pid -> {pts, source:'ocr'|'manual', name, slot} */
  tesseractLoading: null
};

/* Starter lock-in slots in lineup order (bench is BN until changed). */
function lockSlotLabels(){
  const pos = (state.league && state.league.roster_positions) || [
    'PG', 'SG', 'G', 'SF', 'PF', 'F', 'C', 'UTIL', 'UTIL', 'UTIL', 'BN'
  ];
  const out = [];
  for (let i = 0; i < pos.length; i++){
    if (pos[i] === 'BN' || pos[i] === 'IR' || pos[i] === 'TAXI') break;
    out.push(pos[i]);
  }
  return out.length ? out : ['PG', 'SG', 'G', 'SF', 'PF', 'F', 'C', 'UTIL', 'UTIL', 'UTIL'];
}

function slotDisplayLabel(slotKey){
  if (slotKey == null || slotKey === 'BN') return 'BN';
  const labels = lockSlotLabels();
  const i = Number(slotKey);
  if (!Number.isFinite(i) || i < 0 || i >= labels.length) return 'BN';
  /* Mirror Sleeper: all three utility slots read “UTIL”, not UTIL 1/2/3. */
  return labels[i] || 'BN';
}

function slotBadgeClass(label){
  const lab = String(label || 'BN').toUpperCase();
  if (lab === 'PG') return 'pg';
  if (lab === 'SG') return 'sg';
  if (lab === 'SF') return 'sf';
  if (lab === 'PF') return 'pf';
  if (lab === 'C') return 'c';
  if (lab === 'G') return 'g';
  if (lab === 'F') return 'f';
  if (lab === 'UTIL') return 'util';
  return 'bn';
}

function eligHtml(p){
  const raw = (p && (p.fantasy_positions || (p.position ? [p.position] : []))) || [];
  const parts = raw.map(String).filter(Boolean);
  if (!parts.length) return '';
  return parts.map(pos => {
    const cls = slotBadgeClass(pos);
    return '<span class="elig ' + cls + '">' + escapeHtml(pos) + '</span>';
  }).join(' ');
}

function lockStorageKey(){
  return 'pb-matchup-locks:' + LEAGUE_ID + ':w' + String(state.week || '');
}
function loadLockMarks(){
  try {
    const raw = localStorage.getItem(lockStorageKey());
    state.lockMarks = raw ? (JSON.parse(raw) || {}) : {};
  } catch (e){ state.lockMarks = {}; }
}
function saveLockMarks(){
  try { localStorage.setItem(lockStorageKey(), JSON.stringify(state.lockMarks || {})); }
  catch (e){ /* ignore quota */ }
}

function normalizeName(name){
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[.\u2019']/g, '').replace(/[^a-z0-9]/g, '');
}
function canonicalTeam(name){
  const norm = normalizeName(name);
  if (TEAM_ALIASES[norm]) return TEAM_ALIASES[norm];
  return Object.keys(TEAM_COLORS).find(k => normalizeName(k) === norm) || name;
}
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function playerName(p){
  if (!p) return 'Unknown';
  if (p.full_name) return p.full_name;
  return ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || 'Unknown';
}
function progress(pct, label){
  if (window.PatioBoysLoader) PatioBoysLoader.reportProgress(pct, label);
}

function franchiseOfRoster(roster){
  const owner = state.users.find(u => u.user_id === roster.owner_id);
  const metaName = owner && owner.metadata && owner.metadata.team_name;
  const raw = metaName || (owner && owner.display_name) || ('Roster ' + roster.roster_id);
  return {
    rosterId: roster.roster_id,
    team: canonicalTeam(raw),
    manager: (owner && owner.display_name) || '—',
    color: TEAM_COLORS[canonicalTeam(raw)] || '#E8C34A',
    players: (roster.players || []).map(String),
    starters: (roster.starters || []).map(String)
  };
}

function ymd(d){
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  return '' + y + m + day;
}

/* Fantasy weeks roughly Mon–Sun UTC; pull ESPN boards for 7 days around “now”
   plus a few days of history for opp PPG. */
async function loadNbaContext(){
  const today = new Date();
  const dates = [];
  for (let i = -10; i <= 6; i++){
    const d = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() + i));
    dates.push(ymd(d));
  }
  const results = await Promise.all(dates.map(ds =>
    fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=' + ds)
      .then(r => r.ok ? r.json() : null).catch(() => null)
  ));
  const byTeam = {};
  const ptsFor = {};
  const ptsAgainst = {};
  const gp = {};
  const finalEvents = []; /* {eventId, date, home, away} for boxscore FP */
  const seenFinal = {};
  const upcomingCutoff = ymd(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - 1)));

  results.forEach((board, idx) => {
    const ds = dates[idx];
    (board && board.events || []).forEach(ev => {
      const comp = (ev.competitions || [])[0];
      if (!comp) return;
      const comps = comp.competitors || [];
      if (comps.length < 2) return;
      const home = comps.find(c => c.homeAway === 'home') || comps[0];
      const away = comps.find(c => c.homeAway === 'away') || comps[1];
      const hAbbr = home.team && home.team.abbreviation;
      const aAbbr = away.team && away.team.abbreviation;
      if (!hAbbr || !aAbbr) return;
      const status = (comp.status && comp.status.type && comp.status.type.name) || '';
      const final = /FINAL|STATUS_FINAL/i.test(status) || (comp.status && comp.status.type && comp.status.type.completed);
      const eventId = String(ev.id || comp.id || '');
      const hScore = Number(home.score);
      const aScore = Number(away.score);
      if (final && Number.isFinite(hScore) && Number.isFinite(aScore)){
        ptsFor[hAbbr] = (ptsFor[hAbbr] || 0) + hScore;
        ptsAgainst[hAbbr] = (ptsAgainst[hAbbr] || 0) + aScore;
        gp[hAbbr] = (gp[hAbbr] || 0) + 1;
        ptsFor[aAbbr] = (ptsFor[aAbbr] || 0) + aScore;
        ptsAgainst[aAbbr] = (ptsAgainst[aAbbr] || 0) + hScore;
        gp[aAbbr] = (gp[aAbbr] || 0) + 1;
      }
      /* Upcoming / in-window slate for scouting + played-game FP */
      if (ds >= upcomingCutoff){
        (byTeam[hAbbr] = byTeam[hAbbr] || []).push({
          opp: aAbbr, home: true, date: ds, final: !!final, eventId
        });
        (byTeam[aAbbr] = byTeam[aAbbr] || []).push({
          opp: hAbbr, home: false, date: ds, final: !!final, eventId
        });
        if (final && eventId && !seenFinal[eventId]){
          seenFinal[eventId] = true;
          finalEvents.push({eventId, date: ds, home: hAbbr, away: aAbbr});
        }
      }
    });
  });

  const oppg = {};
  Object.keys(gp).forEach(t => {
    if (gp[t] > 0) oppg[t] = ptsAgainst[t] / gp[t];
  });
  const vals = Object.values(oppg);
  const avgOppg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 112;
  return {byTeam, oppg, avgOppg, gp, finalEvents};
}

function parseMadeAtt(cell){
  if (!cell || String(cell).indexOf('-') < 0) return {made: 0, att: 0};
  const parts = String(cell).split('-');
  const made = Number(parts[0]);
  const att = Number(parts[1]);
  return {
    made: Number.isFinite(made) ? made : 0,
    att: Number.isFinite(att) ? att : 0
  };
}

function parseBoxMinutes(cell){
  if (cell == null) return 0;
  const s = String(cell).trim();
  if (!s || s === '-' || s === 'DNP' || s === 'NWT' || s === '0' || s === '00' || s === '0:00') return 0;
  if (s.indexOf(':') >= 0){
    const parts = s.split(':');
    const m = Number(parts[0]);
    const sec = Number(parts[1]);
    if (!Number.isFinite(m)) return 0;
    return m + (Number.isFinite(sec) ? sec / 60 : 0);
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function playerNameKey(name){
  return String(name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '')
    .replace(/[.\u2019']/g, '').replace(/[^a-z0-9]/g, '');
}

function buildRosterNameMap(){
  const map = {}; /* nameKey -> pid */
  const prefer = {}; /* nameKey -> score */
  (state.rosters || []).forEach(r => {
    (r.players || []).forEach(pid => {
      const id = String(pid);
      const p = state.players[id];
      if (!p) return;
      const key = playerNameKey(playerName(p));
      if (key.length < 4) return;
      const score = (p.team ? 2 : 0) + (p.active === false ? 0 : 1);
      if (!map[key] || score >= (prefer[key] || 0)){
        map[key] = id;
        prefer[key] = score;
      }
    });
  });
  return map;
}

function parseEspnBoxscore(payload){
  const rows = [];
  const box = payload && payload.boxscore;
  (box && box.players || []).forEach(teamBlock => {
    const teamAbbr = teamBlock.team && teamBlock.team.abbreviation;
    (teamBlock.statistics || []).forEach(group => {
      const labels = (group.labels || []).map(x => String(x).toUpperCase());
      if (!labels.length) return;
      const idx = {};
      labels.forEach((lab, i) => { idx[lab] = i; });
      const needed = ['PTS', 'REB', 'AST', 'TO', 'STL', 'BLK', 'FG', 'FT', '3PT'];
      if (needed.some(k => idx[k] == null)) return;
      (group.athletes || []).forEach(ath => {
        if (ath.didNotPlay) return;
        const athlete = ath.athlete || {};
        const name = athlete.displayName || athlete.shortName || '';
        const stats = ath.stats || [];
        const cell = (lab) => {
          const i = idx[lab];
          return i == null || i >= stats.length ? null : stats[i];
        };
        const minutes = idx.MIN != null ? parseBoxMinutes(cell('MIN')) : 0;
        if (!(minutes > 0)) return;
        const fg = parseMadeAtt(cell('FG'));
        const ft = parseMadeAtt(cell('FT'));
        const tp = parseMadeAtt(cell('3PT'));
        const toNum = (lab) => {
          const v = Number(cell(lab));
          return Number.isFinite(v) ? v : 0;
        };
        const obj = {
          pts: toNum('PTS'),
          reb: toNum('REB'),
          oreb: toNum('OREB'),
          ast: toNum('AST'),
          stl: toNum('STL'),
          blk: toNum('BLK'),
          to: toNum('TO'),
          fgmi: Math.max(0, fg.att - fg.made),
          ftmi: Math.max(0, ft.att - ft.made),
          tpm: tp.made,
          min: Math.round(minutes * 100) / 100
        };
        if (obj.pts + obj.reb + obj.ast + obj.stl + obj.blk + obj.to + obj.fgmi + obj.ftmi + obj.tpm === 0){
          return;
        }
        rows.push({name, teamAbbr, obj});
      });
    });
  });
  return rows;
}

function applySleeperSingleGameFallback(byPid, nbaWeek){
  const events = (nbaWeek && nbaWeek.finalEvents) || [];
  const finalsByEspn = {};
  events.forEach(ev => {
    (finalsByEspn[ev.home] = finalsByEspn[ev.home] || []).push(ev);
    (finalsByEspn[ev.away] = finalsByEspn[ev.away] || []).push(ev);
  });
  (state.matchups || []).forEach(m => {
    const ptsMap = m && m.players_points;
    if (!ptsMap) return;
    Object.keys(ptsMap).forEach(pid => {
      if (byPid[pid] && byPid[pid].length) return;
      const v = Number(ptsMap[pid]);
      if (!Number.isFinite(v) || v <= 0) return;
      const p = state.players[pid] || {};
      const espn = espnAbbr(p.team);
      const finals = (espn && finalsByEspn[espn]) || [];
      if (finals.length !== 1) return;
      const ev = finals[0];
      const oppEspn = espn === ev.home ? ev.away : ev.home;
      byPid[pid] = [{
        eventId: ev.eventId,
        date: ev.date,
        opp: ESPN_TO_SLEEPER[oppEspn] || oppEspn,
        fp: Math.round(v * 10) / 10,
        source: 'sleeper-week'
      }];
    });
  });
  return byPid;
}

/* Score final ESPN boxscores under league settings → per-game FP by Sleeper pid. */
async function loadWeekGameFp(nbaWeek){
  const scoring = state.league && state.league.scoring_settings;
  const events = (nbaWeek && nbaWeek.finalEvents) || [];
  if (!scoring || !window.LockInDist || typeof LockInDist.scoreGame !== 'function'){
    state.gameFpByPid = {};
    return {};
  }
  let byPid = {};
  if (state._boxFpByPid){
    byPid = JSON.parse(JSON.stringify(state._boxFpByPid));
  } else if (events.length){
    const nameMap = buildRosterNameMap();
    const chunks = [];
    for (let i = 0; i < events.length; i += 8) chunks.push(events.slice(i, i + 8));
    for (let c = 0; c < chunks.length; c++){
      const pack = await Promise.all(chunks[c].map(ev =>
        fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=' + ev.eventId)
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
          .then(payload => ({ev, payload}))
      ));
      pack.forEach(item => {
        if (!item.payload) return;
        const lines = parseEspnBoxscore(item.payload);
        const home = item.ev.home;
        const away = item.ev.away;
        lines.forEach(line => {
          const key = playerNameKey(line.name);
          const pid = nameMap[key];
          if (!pid) return;
          const fp = LockInDist.scoreGame(line.obj, scoring);
          if (fp == null || !Number.isFinite(fp)) return;
          let opp = null;
          if (line.teamAbbr && home && away){
            if (line.teamAbbr === home) opp = away;
            else if (line.teamAbbr === away) opp = home;
          }
          const oppLabel = opp ? (ESPN_TO_SLEEPER[opp] || opp) : null;
          (byPid[pid] = byPid[pid] || []).push({
            eventId: item.ev.eventId,
            date: item.ev.date,
            opp: oppLabel,
            fp: Math.round(fp * 10) / 10
          });
        });
      });
    }
    Object.keys(byPid).forEach(pid => {
      byPid[pid].sort((a, b) => String(a.date).localeCompare(String(b.date)));
    });
    state._boxFpByPid = JSON.parse(JSON.stringify(byPid));
  }

  /* If a team has exactly one final this window and boxscore name-match missed,
     fall back to Sleeper’s week total for that single night. */
  applySleeperSingleGameFallback(byPid, nbaWeek);
  state.gameFpByPid = byPid;
  return byPid;
}

function espnAbbr(sleeperTeam){
  if (!sleeperTeam) return null;
  return SLEEPER_TO_ESPN[String(sleeperTeam).toUpperCase()] || String(sleeperTeam).toUpperCase();
}

function gameFpForPid(pid){
  const id = String(pid);
  return (state.gameFpByPid && state.gameFpByPid[id]) || [];
}

function scoutPlayer(pid, dist){
  const p = state.players[pid] || {};
  const team = p.team;
  const espn = espnAbbr(team);
  const nba = state.nbaWeek;
  const games = (espn && nba && nba.byTeam[espn]) || [];
  const upcoming = games.filter(g => !g.final);
  const opps = upcoming.map(g => g.opp);
  const oppLabels = opps.map(o => ESPN_TO_SLEEPER[o] || o);
  const scored = gameFpForPid(pid);
  const scoredByEvent = {};
  scored.forEach(g => { if (g.eventId) scoredByEvent[g.eventId] = g; });

  /* Full slate under the name: played → FP, upcoming → opponent abbr. */
  const slate = games.map(g => {
    const oppLabel = ESPN_TO_SLEEPER[g.opp] || g.opp;
    if (g.final){
      const hit = (g.eventId && scoredByEvent[g.eventId])
        || scored.find(s => s.date === g.date && (!s.opp || s.opp === oppLabel));
      if (hit && hit.fp != null){
        return {kind: 'fp', fp: hit.fp, opp: oppLabel, date: g.date, eventId: g.eventId || hit.eventId};
      }
      return {kind: 'played', opp: oppLabel, date: g.date, eventId: g.eventId || null, fp: null};
    }
    return {kind: 'opp', opp: oppLabel, date: g.date, eventId: g.eventId || null};
  });
  /* Fallback: scored lines with no matching slate row (name/team miss). */
  if (!slate.some(s => s.kind === 'fp') && scored.length){
    scored.forEach(g => {
      if (slate.some(s => s.eventId && g.eventId && s.eventId === g.eventId)) return;
      slate.push({kind: 'fp', fp: g.fp, opp: g.opp, date: g.date, eventId: g.eventId});
    });
    slate.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  }

  const smashRate = dist && dist.smashBoomRate != null ? Number(dist.smashBoomRate)
    : (dist && window.LockInDist && LockInDist.smashBoomRate ? LockInDist.smashBoomRate(dist) : null);
  let lean = 'neutral';
  let leanScore = 0;
  let why = [];

  if (smashRate != null && smashRate >= 0.38){ leanScore += 1; why.push('high smash rate'); }
  if (smashRate != null && smashRate <= 0.22){ leanScore -= 1; why.push('low smash rate'); }

  if (nba && opps.length){
    let envSum = 0, n = 0;
    opps.forEach(o => {
      const oAllowed = nba.oppg[o];
      if (oAllowed != null){
        envSum += (oAllowed - nba.avgOppg) / 6; /* ~6 pts ≈ 1 step */
        n++;
      }
    });
    if (n){
      const env = envSum / n;
      if (env >= 0.45){ leanScore += 1; why.push('soft defensive slate (' + oppLabels.join('/') + ')'); }
      else if (env <= -0.45){ leanScore -= 1; why.push('tough defensive slate (' + oppLabels.join('/') + ')'); }
      else why.push('vs ' + oppLabels.join('/'));
    } else {
      why.push('vs ' + oppLabels.join('/'));
    }
    /* Back-to-back in upcoming window */
    const days = upcoming.map(g => g.date).sort();
    for (let i = 1; i < days.length; i++){
      const a = days[i - 1], b = days[i];
      /* yyyymmdd consecutive */
      const da = Date.UTC(+a.slice(0,4), +a.slice(4,6)-1, +a.slice(6,8));
      const db = Date.UTC(+b.slice(0,4), +b.slice(4,6)-1, +b.slice(6,8));
      if ((db - da) / 86400000 === 1){
        leanScore -= 1;
        why.push('B2B risk');
        break;
      }
    }
  } else if (!team){
    why.push('no NBA team');
    leanScore -= 1;
  }

  const injury = String(p.injury_status || '').toUpperCase();
  if (injury === 'O' || injury === 'OUT' || injury === 'IR'){
    leanScore -= 2;
    why.push(injury === 'IR' ? 'on IR' : 'ruled OUT');
  } else if (injury === 'DTD' || injury === 'Q' || injury === 'QUESTIONABLE'){
    leanScore -= 1;
    why.push('questionable / DTD');
  } else if (injury === 'P' || injury === 'PROBABLE'){
    why.push('probable');
  }

  if (leanScore >= 2) lean = 'smash';
  else if (leanScore <= -2) lean = 'bust';
  else if (leanScore === 1) lean = 'smash';
  else if (leanScore === -1) lean = 'bust';

  return {
    lean: leanScore === 0 ? 'neutral' : lean,
    leanScore,
    why: why.join(' · ') || '—',
    opps: oppLabels,
    slate,
    gamesLeft: upcoming.length,
    nextGame: upcoming[0]
      ? {date: upcoming[0].date, opp: oppLabels[0] || null}
      : null,
    smashRate,
    injury: injury || null
  };
}

/* True lock-in nights = green LOCKED only (OCR / manual). Scored starters with
   blue UNLOCKED can still be swapped — never treat API starters_points as locked. */
function lockedPtsFor(pid){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  if (marks[id] && marks[id].pts != null && Number.isFinite(Number(marks[id].pts))){
    return Number(marks[id].pts);
  }
  return null;
}

function weekPtsFor(pid, matchupRow){
  const id = String(pid);
  /* Prefer latest single-game FP (lock-in unit), not Sleeper week totals. */
  const games = gameFpForPid(id);
  if (games.length){
    const last = games[games.length - 1];
    if (last && last.fp != null && Number.isFinite(Number(last.fp))) return Number(last.fp);
  }
  if (matchupRow && matchupRow.players_points && matchupRow.players_points[id] != null){
    const v = Number(matchupRow.players_points[id]);
    if (Number.isFinite(v)) return v;
  }
  const mark = state.lockMarks && state.lockMarks[id];
  if (mark && mark.pts != null && Number.isFinite(Number(mark.pts))) return Number(mark.pts);
  return null;
}

function isLocked(pid){
  return lockedPtsFor(pid) != null;
}

function slotKeyForPidOnSide(side, pid){
  const id = String(pid);
  const mark = state.lockMarks && state.lockMarks[id];
  if (mark && mark.slot != null && mark.slot !== '') return mark.slot;
  const starters = (side && side.matchup && side.matchup.starters)
    || (side && side.franchise && side.franchise.starters)
    || [];
  const idx = starters.map(String).indexOf(id);
  if (idx >= 0 && idx < lockSlotLabels().length) return idx;
  return 'BN';
}

function sideForPid(pid){
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return null;
  return pair.sides.find(s => (s.franchise.players || []).map(String).includes(String(pid))) || null;
}

function toggleLockMark(pid, weekPts, name, slotKey){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  if (marks[id]){
    delete marks[id];
  } else {
    const pts = weekPts != null && Number.isFinite(Number(weekPts)) ? Number(weekPts) : 0;
    const side = sideForPid(id);
    const slot = slotKey != null ? slotKey : slotKeyForPidOnSide(side, id);
    marks[id] = {pts, source: 'manual', name: name || id, slot};
  }
  saveLockMarks();
  render();
}

function setPlayerSlot(pid, slotKey){
  const id = String(pid);
  const marks = state.lockMarks || (state.lockMarks = {});
  const side = sideForPid(id);
  const pts = weekPtsFor(id, side && side.matchup);
  if (!marks[id]){
    /* Changing BN → a lock slot banks them into that position. */
    if (slotKey === 'BN') return;
    marks[id] = {
      pts: pts != null && Number.isFinite(Number(pts)) ? Number(pts) : 0,
      source: 'manual',
      name: playerName(state.players[id]),
      slot: slotKey
    };
  } else {
    marks[id].slot = slotKey;
    if (slotKey === 'BN'){
      /* BN means unlocked / not filling a lock slot. */
      delete marks[id];
    }
  }
  saveLockMarks();
  render();
}

function buildPairs(matchupRows, franchisesByRoster){
  const byMid = {};
  (matchupRows || []).forEach(m => {
    if (m.matchup_id == null) return;
    (byMid[m.matchup_id] = byMid[m.matchup_id] || []).push(m);
  });
  return Object.keys(byMid).map(mid => {
    const rows = byMid[mid];
    const sides = rows.map(r => {
      const fr = franchisesByRoster[String(r.roster_id)] || {
        team: 'Roster ' + r.roster_id, color: '#E8C34A', players: [], manager: '—'
      };
      return {
        matchup: r,
        franchise: fr,
        points: Number(r.points) || 0
      };
    });
    while (sides.length < 2){
      sides.push({matchup: null, franchise: {team: 'BYE', color: '#8B93A6', players: []}, points: 0});
    }
    return {id: mid, sides: sides.slice(0, 2)};
  }).sort((a, b) => {
    const an = a.sides.map(s => s.franchise.team).join(' ');
    const bn = b.sides.map(s => s.franchise.team).join(' ');
    return an.localeCompare(bn);
  });
}

function bankOptsForSide(sideDists, lockedScores){
  const slots = (window.LockInDist && LockInDist.LOCK_SLOTS) || 10;
  const left = Math.max(1, slots - (lockedScores || []).length);
  const unlocked = (sideDists || []).filter(d => d && !d._locked);
  const floor = window.LockInDist && LockInDist.rosterBankFloor
    ? LockInDist.rosterBankFloor(unlocked, left)
    : null;
  const week = state.week;
  const seasonWeeks = Number(state.league && state.league.settings && state.league.settings.playoff_week_start) > 1
    ? Number(state.league.settings.playoff_week_start) - 1
    : 21;
  return {
    week,
    seasonWeeks,
    slots: left,
    rosterDists: unlocked,
    rosterFloor: floor,
    dow: (new Date()).getDay(),
    lockedCount: (lockedScores || []).length
  };
}

function sidePlayerRows(side){
  const fr = side.franchise;
  const mrow = side.matchup;
  const starters = (mrow && mrow.starters || fr.starters || []).map(String);
  const starterSet = new Set(starters);
  const labels = lockSlotLabels();
  /* Lineup order: starter slots first (by index), then bench alphabetically / by lock. */
  const starterRows = [];
  for (let i = 0; i < labels.length; i++){
    const id = starters[i];
    if (id && id !== '0' && id !== '') starterRows.push(id);
  }
  const benchIds = (fr.players || []).map(String).filter(id => !starterSet.has(id));
  benchIds.sort((a, b) => {
    const da = state.lockByPid[a] || state.lockByPid[String(a)];
    const db = state.lockByPid[b] || state.lockByPid[String(b)];
    const la = da && (da.lockOvr != null ? da.lockOvr : da.mean);
    const lb = db && (db.lockOvr != null ? db.lockOvr : db.mean);
    return (lb || 0) - (la || 0);
  });
  const pids = starterRows.concat(benchIds);

  const lockedScores = [];
  const distList = [];
  const rows = pids.map(pid => {
    const id = String(pid);
    const p = state.players[id] || {};
    const dist = state.lockByPid[id] ? Object.assign({pid: id}, state.lockByPid[id]) : null;
    const pts = weekPtsFor(id, mrow);
    const lockPts = lockedPtsFor(id);
    const locked = lockPts != null;
    const slot = slotKeyForPidOnSide(side, id);
    const starter = starterSet.has(id);
    if (locked) lockedScores.push(lockPts);
    if (dist){
      dist._locked = locked;
      distList.push(dist);
    }
    const scout = scoutPlayer(id, dist);
    return {
      pid: id, p, dist, pts, lockPts, locked, scout,
      starter, slot, slotLabel: slotDisplayLabel(slot)
    };
  });

  const opts = bankOptsForSide(distList, lockedScores);
  rows.forEach(r => {
    if (!r.dist || !window.LockInDist || typeof LockInDist.lockBankPlan !== 'function'){
      r.bank = null;
      return;
    }
    if (r.locked){
      r.bank = {
        mark: Math.round(r.lockPts != null ? r.lockPts : r.pts),
        rate: 1,
        why: 'Green LOCKED into ' + (r.slotLabel || 'slot'),
        style: 'locked'
      };
      return;
    }
    const playerOpts = Object.assign({}, opts, {
      gamesLeft: r.scout && r.scout.gamesLeft != null
        ? r.scout.gamesLeft
        : ((r.scout && r.scout.slate) || []).filter(s => s.kind === 'opp').length,
      injury: r.scout && r.scout.injury
    });
    r.bank = LockInDist.lockBankPlan(r.dist, playerOpts);
  });

  const pack = {
    rows,
    lockedScores,
    opts,
    starters: rows.filter(r => r.starter),
    bench: rows.filter(r => !r.starter)
  };
  rows.forEach(r => { r.rec = buildRec(r, pack); });
  return pack;
}

function latestScoredFp(r){
  const fps = ((r.scout && r.scout.slate) || []).filter(s => s.kind === 'fp' && s.fp != null);
  if (fps.length) return Number(fps[fps.length - 1].fp);
  if (r.lockPts != null && Number.isFinite(Number(r.lockPts))) return Number(r.lockPts);
  return null;
}

function openLockSlots(pack){
  const labels = lockSlotLabels();
  const taken = new Set();
  (pack.rows || []).forEach(r => {
    if (!r.locked) return;
    if (r.slot == null || r.slot === 'BN') return;
    taken.add(Number(r.slot));
  });
  return labels.map((lab, i) => ({index: i, label: lab, open: !taken.has(i)}))
    .filter(s => s.open);
}

function eligList(p){
  return (p && (p.fantasy_positions || (p.position ? [p.position] : []))) || [];
}

function fitsLockSlot(p, slotLabel){
  const elig = eligList(p).map(String);
  const lab = String(slotLabel || '').toUpperCase();
  if (lab === 'UTIL') return true;
  if (lab === 'G') return elig.some(e => e === 'PG' || e === 'SG' || e === 'G');
  if (lab === 'F') return elig.some(e => e === 'SF' || e === 'PF' || e === 'F');
  return elig.indexOf(lab) >= 0;
}

function preferSlotForPlayer(p, openSlots){
  const order = ['PG', 'SG', 'SF', 'PF', 'C', 'G', 'F', 'UTIL'];
  const ranked = (openSlots || []).slice().sort((a, b) =>
    order.indexOf(a.label) - order.indexOf(b.label));
  const elig = eligList(p).map(String);
  for (let i = 0; i < ranked.length; i++){
    const s = ranked[i];
    if (s.label === 'UTIL') continue;
    if (elig.indexOf(s.label) >= 0 && fitsLockSlot(p, s.label)) return s;
  }
  for (let i = 0; i < ranked.length; i++){
    const s = ranked[i];
    if ((s.label === 'G' || s.label === 'F') && fitsLockSlot(p, s.label)) return s;
  }
  for (let i = 0; i < ranked.length; i++){
    if (fitsLockSlot(p, ranked[i].label)) return ranked[i];
  }
  return null;
}

function shortPlayerName(p){
  if (!p) return '—';
  if (p.last_name) return p.last_name;
  const full = playerName(p);
  const parts = full.split(/\s+/);
  return parts.length ? parts[parts.length - 1] : full;
}

function weekdayLabel(ymdStr){
  if (!ymdStr || String(ymdStr).length < 8) return null;
  const s = String(ymdStr);
  const d = new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)));
  if (!Number.isFinite(d.getTime())) return null;
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()];
}

function nextGameLabel(scout){
  const slate = (scout && scout.slate) || [];
  const next = slate.find(s => s.kind === 'opp');
  if (!next) return null;
  const day = weekdayLabel(next.date);
  return (day || 'next') + (next.opp ? (' vs ' + next.opp) : '');
}

function isBenchRow(r){
  return !r.starter || r.slot === 'BN' || r.slotLabel === 'BN';
}

/* Starter → better eligible teammate for the SAME lock slot (never Tatum into PG). */
function betterSwitchTarget(r, pack){
  const myMean = r.dist && Number(r.dist.mean) || 0;
  const slotLabel = r.slotLabel && r.slotLabel !== 'BN' ? String(r.slotLabel).toUpperCase() : null;
  if (!slotLabel) return null; /* starters only — bench uses switch-in */
  const cands = (pack.rows || []).filter(o => {
    if (!o || o.pid === r.pid || o.locked) return false;
    const inj = o.scout && o.scout.injury;
    if (inj === 'OUT' || inj === 'O' || inj === 'IR') return false;
    if (!fitsLockSlot(o.p, slotLabel)) return false;
    const mean = o.dist && Number(o.dist.mean) || 0;
    if (!(mean > myMean + 2)) return false;
    const left = o.scout && o.scout.gamesLeft || 0;
    const scored = latestScoredFp(o);
    return left > 0 || scored != null;
  }).sort((a, b) => (Number(b.dist && b.dist.mean) || 0) - (Number(a.dist && a.dist.mean) || 0));
  const best = cands[0] || null;
  if (!best) return null;
  return {row: best, into: slotLabel};
}

/* Bench player → starter they should replace (slot they fit, clearly better). */
function benchSwitchInOver(r, pack){
  const myMean = r.dist && Number(r.dist.mean) || 0;
  const myScored = latestScoredFp(r);
  const myBank = r.bank && r.bank.mark != null ? Number(r.bank.mark) : null;
  const cands = [];
  (pack.rows || []).forEach(o => {
    if (!o || o.pid === r.pid || o.locked || isBenchRow(o)) return;
    const into = o.slotLabel && o.slotLabel !== 'BN' ? String(o.slotLabel).toUpperCase() : null;
    if (!into || !fitsLockSlot(r.p, into)) return;
    const theirInj = o.scout && o.scout.injury;
    const theirMean = o.dist && Number(o.dist.mean) || 0;
    const theirScored = latestScoredFp(o);
    let why = null;
    let score = 0;
    if (theirInj === 'OUT' || theirInj === 'O' || theirInj === 'IR'){
      why = (theirInj === 'IR' ? 'IR' : 'OUT') + ' starter';
      score = 1000 + myMean;
    } else if (myMean > theirMean + 4){
      why = 'higher Avg';
      score = (myMean - theirMean) * 10;
    } else if (myScored != null && myBank != null && myScored + 1e-9 >= myBank
      && (theirScored == null || theirScored + 1e-9 < (o.bank && o.bank.mark != null ? Number(o.bank.mark) : myBank))){
      why = formatFp(myScored) + ' bankable vs their night';
      score = 50 + myScored;
    } else if (myScored != null && theirScored != null && myScored > theirScored + 8
      && myMean >= theirMean - 2){
      why = formatFp(myScored) + ' > ' + formatFp(theirScored) + ' tonight';
      score = myScored - theirScored;
    }
    if (why) cands.push({row: o, into: into, why: why, score: score});
  });
  cands.sort((a, b) => b.score - a.score);
  return cands[0] || null;
}

function switchOutLabel(alt){
  if (!alt || !alt.row) return 'Switch';
  const name = shortPlayerName(alt.row.p);
  return alt.into
    ? ('Switch · ' + name + ' @ ' + alt.into)
    : ('Switch · ' + name);
}

function switchInLabel(over){
  if (!over || !over.row) return 'Switch in';
  return 'In · over ' + shortPlayerName(over.row.p)
    + (over.into ? (' @ ' + over.into) : '');
}

/* Actionable recommendation: Lock / Switch / Wait (+ reason).
   Only starting slots score — bench Switch means switch THIS player in. */
function buildRec(r, pack){
  if (r.locked){
    return {
      action: 'locked',
      label: 'Locked · ' + (r.slotLabel || 'slot'),
      reason: 'Already banked',
      cls: 'rec-locked'
    };
  }
  const bench = isBenchRow(r);
  const injury = r.scout && r.scout.injury;
  const gamesLeft = r.scout && r.scout.gamesLeft != null
    ? r.scout.gamesLeft
    : ((r.scout && r.scout.slate) || []).filter(s => s.kind === 'opp').length;
  const scored = latestScoredFp(r);
  const bank = r.bank && r.bank.mark != null ? Number(r.bank.mark) : null;
  const open = openLockSlots(pack);
  /* Prefer locking into the slot they already occupy when it’s still open. */
  const currentSlot = (r.slot != null && r.slot !== 'BN')
    ? {index: Number(r.slot), label: String(r.slotLabel || '').toUpperCase()}
    : null;
  const currentOpen = currentSlot
    && open.some(s => s.index === currentSlot.index)
    && fitsLockSlot(r.p, currentSlot.label);
  const slot = currentOpen ? currentSlot : preferSlotForPlayer(r.p, open);
  const nextLbl = nextGameLabel(r.scout);

  /* ——— Bench: only Switch when they should come in over a starter ——— */
  if (bench){
    if (injury === 'OUT' || injury === 'O' || injury === 'IR'){
      return {
        action: 'sit',
        label: 'Sit',
        reason: 'Bench · ' + (injury === 'IR' ? 'IR' : 'OUT'),
        cls: 'rec-sit'
      };
    }
    const over = benchSwitchInOver(r, pack);
    if (over && over.row){
      return {
        action: 'switch',
        label: switchInLabel(over),
        reason: over.why || ('better than ' + shortPlayerName(over.row.p)),
        cls: 'rec-switch'
      };
    }
    if (scored != null && bank != null && scored + 1e-9 >= bank && slot){
      return {
        action: 'lock',
        label: 'Lock · ' + slot.label,
        reason: formatFp(scored) + ' ≥ Bank ' + bank + ' · move off BN',
        cls: 'rec-lock'
      };
    }
    if (injury === 'DTD' || injury === 'Q' || injury === 'QUESTIONABLE'){
      return {
        action: 'wait',
        label: 'Wait',
        reason: 'Bench · questionable',
        cls: 'rec-wait'
      };
    }
    if (gamesLeft > 0){
      return {
        action: 'wait',
        label: 'Wait',
        reason: 'Bench'
          + (bank != null ? (' · Bank ≥' + bank) : '')
          + (nextLbl ? (' · ' + nextLbl) : ''),
        cls: 'rec-wait'
      };
    }
    return {action: 'none', label: '—', reason: 'Bench · no start path', cls: 'rec-none'};
  }

  /* ——— Starters ——— */
  if (injury === 'OUT' || injury === 'O' || injury === 'IR'){
    const alt = betterSwitchTarget(r, pack);
    const tag = injury === 'IR' ? 'IR' : 'OUT';
    if (alt && alt.row){
      return {
        action: 'switch',
        label: switchOutLabel(alt),
        reason: tag + ' — use ' + shortPlayerName(alt.row.p)
          + (alt.into ? (' @ ' + alt.into) : ''),
        cls: 'rec-switch'
      };
    }
    return {action: 'sit', label: 'Sit', reason: 'ruled ' + tag, cls: 'rec-sit'};
  }

  if (scored != null && bank != null && scored + 1e-9 >= bank){
    if (slot){
      return {
        action: 'lock',
        label: 'Lock · ' + slot.label,
        reason: formatFp(scored) + ' ≥ Bank ' + bank,
        cls: 'rec-lock'
      };
    }
    return {
      action: 'lock',
      label: 'Lock',
      reason: formatFp(scored) + ' ≥ Bank ' + bank + ' · no open slot',
      cls: 'rec-lock'
    };
  }

  if (scored != null && bank != null && scored < bank){
    const alt = betterSwitchTarget(r, pack);
    const myMean = r.dist && Number(r.dist.mean) || 0;
    const altMean = alt && alt.row && alt.row.dist && Number(alt.row.dist.mean) || 0;
    if (alt && alt.row && altMean - myMean >= 4){
      return {
        action: 'switch',
        label: switchOutLabel(alt),
        reason: formatFp(scored) + ' < Bank ' + bank
          + (alt.into ? (' · ' + alt.into + '-eligible') : ''),
        cls: 'rec-switch'
      };
    }
    if (gamesLeft > 0){
      return {
        action: 'wait',
        label: 'Wait',
        reason: formatFp(scored) + ' < ' + bank
          + (nextLbl ? (' · next ' + nextLbl) : (' · ' + gamesLeft + ' left')),
        cls: 'rec-wait'
      };
    }
    return {
      action: 'sit',
      label: 'Pass',
      reason: formatFp(scored) + ' below Bank ' + bank + ' · no games left',
      cls: 'rec-sit'
    };
  }

  if (injury === 'DTD' || injury === 'Q' || injury === 'QUESTIONABLE'){
    return {
      action: 'wait',
      label: 'Wait',
      reason: 'Questionable' + (nextLbl ? (' · confirm by ' + nextLbl) : ''),
      cls: 'rec-wait'
    };
  }

  if (gamesLeft > 0){
    const bits = [];
    if (bank != null) bits.push('Bank ≥' + bank);
    if (nextLbl) bits.push('hold for ' + nextLbl);
    else bits.push(gamesLeft + ' game' + (gamesLeft > 1 ? 's' : '') + ' left');
    return {action: 'wait', label: 'Wait', reason: bits.join(' · '), cls: 'rec-wait'};
  }

  if (scored != null){
    return {
      action: 'sit',
      label: bank != null && scored < bank ? 'Pass' : '—',
      reason: 'No games left this window',
      cls: 'rec-sit'
    };
  }
  return {action: 'none', label: '—', reason: 'No slate', cls: 'rec-none'};
}

function renderAdvice(pair, leftPack, rightPack){
  const el = document.getElementById('advice');
  if (!pair){ el.innerHTML = ''; return; }
  const focus = state.focusTeam;
  const focusSide = pair.sides.find(s => s.franchise.team === focus) || pair.sides[0];
  const oppSide = pair.sides.find(s => s !== focusSide) || pair.sides[1];
  const focusPack = focusSide === pair.sides[0] ? leftPack : rightPack;
  const oppPack = focusSide === pair.sides[0] ? rightPack : leftPack;

  const tips = [];
  const lockedN = focusPack.lockedScores.length;
  const slots = (window.LockInDist && LockInDist.LOCK_SLOTS) || 10;
  const leftSlots = Math.max(0, slots - lockedN);
  tips.push('<li><span class="tag lock">Banked</span><strong>'
    + escapeHtml(focusSide.franchise.team) + '</strong> has <strong>' + lockedN + '/' + slots
    + '</strong> green <strong>LOCKED</strong> nights'
    + (focusPack.lockedScores.length
      ? (' (' + focusPack.lockedScores.map(x => Math.round(x)).join(', ') + ')')
      : '')
    + '. Blue/cyan <strong>UNLOCKED</strong> can still move. Bench stays <strong>BN</strong> until you set Pos. <strong>'
    + leftSlots + '</strong> slots left'
    + (focusPack.opts.rosterFloor != null
      ? (' · remaining top-' + leftSlots + ' bar ~' + Math.round(focusPack.opts.rosterFloor))
      : '')
    + '. Upload a screenshot or tap a lock pill to sync.</li>');

  const focusPts = focusSide.points;
  const oppPts = oppSide.points;
  const margin = focusPts - oppPts;
  tips.push('<li><span class="tag lock">Scoreboard</span>Live <strong>'
    + Math.round(focusPts) + '</strong>–<strong>' + Math.round(oppPts) + '</strong> vs '
    + escapeHtml(oppSide.franchise.team)
    + (margin > 5 ? ' · you lead — protect locks, don’t force fringe banks.'
      : (margin < -5 ? ' · trailing — hunt smashes; fringe Bank ≥ still applies.'
        : ' · tight — bank quality nights only.'))
    + '</li>');

  const lockNow = focusPack.rows.filter(r => r.rec && r.rec.action === 'lock').slice(0, 4);
  if (lockNow.length){
    tips.push('<li><span class="tag smash">Lock now</span>'
      + lockNow.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong> '
        + escapeHtml(r.rec.label)
        + ' <span style="color:var(--ink-dim)">(' + escapeHtml(r.rec.reason) + ')</span>')
        .join(' · ')
      + '.</li>');
  }
  const switches = focusPack.rows.filter(r => r.rec && r.rec.action === 'switch').slice(0, 4);
  if (switches.length){
    tips.push('<li><span class="tag bust">Switch</span>'
      + switches.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong> '
        + escapeHtml(r.rec.label)
        + ' <span style="color:var(--ink-dim)">(' + escapeHtml(r.rec.reason) + ')</span>')
        .join(' · ')
      + '.</li>');
  }
  const waits = focusPack.rows
    .filter(r => r.rec && r.rec.action === 'wait' && r.starter)
    .slice(0, 4);
  if (waits.length){
    tips.push('<li><span class="tag lock">Wait</span>'
      + waits.map(r => '<strong>' + escapeHtml(playerName(r.p)) + '</strong>'
        + ' <span style="color:var(--ink-dim)">(' + escapeHtml(r.rec.reason) + ')</span>')
        .join(' · ')
      + '.</li>');
  }

  const oppLocks = oppPack.rows.filter(r => r.rec && r.rec.action === 'lock').slice(0, 3);
  if (oppLocks.length){
    tips.push('<li><span class="tag news">Opp watch</span>'
      + escapeHtml(oppSide.franchise.team) + ' ready to lock: '
      + oppLocks.map(r => escapeHtml(playerName(r.p))).join(', ')
      + ' — don’t leave a weak lock slot open if they go off.</li>');
  }

  const newsBits = focusPack.rows.filter(r => r.scout.injury).slice(0, 5);
  if (newsBits.length){
    tips.push('<li><span class="tag news">News</span>'
      + newsBits.map(r => escapeHtml(playerName(r.p)) + ' · ' + escapeHtml(r.scout.injury)
        + (r.p.injury_notes ? (' — ' + escapeHtml(String(r.p.injury_notes).slice(0, 80))) : ''))
        .join(' · ')
      + '.</li>');
  }

  el.innerHTML = '<h2>Advice · ' + escapeHtml(focusSide.franchise.team) + '</h2><ul>' + tips.join('') + '</ul>';
}

function slotBadgeHtml(pid, slotKey){
  const labels = lockSlotLabels();
  const label = slotDisplayLabel(slotKey);
  const cls = slotBadgeClass(label);
  const opts = labels.map((lab, i) => {
    const sel = String(slotKey) === String(i) ? ' selected' : '';
    return '<option value="' + i + '"' + sel + '>' + escapeHtml(lab) + '</option>';
  }).join('');
  const bnSel = (slotKey == null || slotKey === 'BN') ? ' selected' : '';
  return '<select class="slot-badge ' + cls + '" data-slot-pid="' + escapeHtml(String(pid))
    + '" title="Lineup slot (same as Sleeper)">'
    + opts
    + '<option value="BN"' + bnSel + '>BN</option>'
    + '</select>';
}

function formatFp(v){
  if (v == null || !Number.isFinite(Number(v))) return '—';
  const n = Number(v);
  return Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);
}

function slateHtml(r){
  const slate = (r.scout && r.scout.slate) || [];
  const lockPts = r.lockPts != null && Number.isFinite(Number(r.lockPts)) ? Number(r.lockPts) : null;
  let lockMatched = false;
  const chips = slate.map(item => {
    if (item.kind === 'fp' && item.fp != null){
      const isLock = !lockMatched && lockPts != null && Math.abs(Number(item.fp) - lockPts) < 0.55;
      if (isLock) lockMatched = true;
      const title = (item.opp ? ('vs ' + item.opp + ' · ') : '')
        + formatFp(item.fp) + ' FP'
        + (isLock ? ' · LOCKED IN' : '');
      return '<span class="fp-chip' + (isLock ? ' lock' : '') + '" title="' + escapeHtml(title) + '">'
        + escapeHtml(formatFp(item.fp)) + '</span>';
    }
    if (item.kind === 'played'){
      return '<span class="opp-chip" title="Played — FP unavailable">—</span>';
    }
    if (item.opp){
      return '<span class="opp-chip" title="Upcoming">vs ' + escapeHtml(item.opp) + '</span>';
    }
    return '';
  }).filter(Boolean);
  /* Locked score with no matching boxscore chip — still show white lock FP. */
  if (r.locked && lockPts != null && !lockMatched){
    chips.unshift(
      '<span class="fp-chip lock" title="Locked in · ' + escapeHtml(formatFp(lockPts)) + ' FP">'
      + escapeHtml(formatFp(lockPts)) + '</span>'
    );
  }
  return chips.length ? ('<div class="slate">' + chips.join('') + '</div>') : '';
}

function playerRowHtml(r){
  const avg = r.dist && r.dist.mean != null ? r.dist.mean.toFixed(1) : '—';
  const smash = r.scout.smashRate != null ? Math.round(r.scout.smashRate * 100) + '%' : '—';
  const bank = r.bank && r.bank.mark != null ? r.bank.mark : '—';
  const bankCls = r.locked ? 'num lock-score' : 'num';
  const bankTitle = (r.bank && r.bank.why) || '';
  const ovr = r.dist && r.dist.lockOvr != null ? Math.round(r.dist.lockOvr) : '—';
  const rec = r.rec || {label: '—', reason: '', cls: 'rec-none'};
  const hasFp = (r.scout.slate || []).some(s => s.kind === 'fp' && s.fp != null)
    || (r.lockPts != null && Number(r.lockPts) > 0)
    || (r.pts != null && Number(r.pts) > 0);
  const pillCls = r.locked ? 'locked' : (hasFp ? 'open' : 'none');
  const pillTxt = r.locked ? 'Locked' : (hasFp ? 'Unlocked' : 'Not lock');
  const lockPtsAttr = r.lockPts != null ? r.lockPts
    : (r.scout.slate || []).filter(s => s.kind === 'fp' && s.fp != null).map(s => s.fp).slice(-1)[0];
  const pillTitle = r.locked
    ? ('Green LOCKED at ' + (r.slotLabel || 'slot') + ' — counts toward lock-in. Click to unmark.')
    : (hasFp
      ? 'Scored but still UNLOCKED (can sub/move). Click to mark as green LOCKED.'
      : 'No scored night yet. Click to mark locked if needed.');
  const trCls = (r.locked ? 'locked' : '') + (!r.starter ? ' bench' : '');
  const elig = eligHtml(r.p);
  const meta = (r.p.team ? (' · ' + escapeHtml(r.p.team)) : '')
    + (r.scout.injury ? (' · ' + escapeHtml(r.scout.injury)) : '');
  return '<tr class="' + trCls.trim() + '">'
    + '<td class="player"><div class="player-row"><div class="player-main">'
    + escapeHtml(playerName(r.p))
    + '<button type="button" class="lock-pill ' + pillCls + '" data-lock-pid="' + escapeHtml(r.pid)
    + '" data-lock-pts="' + (lockPtsAttr != null ? lockPtsAttr : '') + '" data-lock-slot="'
    + escapeHtml(String(r.slot == null ? 'BN' : r.slot)) + '" title="' + escapeHtml(pillTitle) + '">'
    + pillTxt + '</button>'
    + '<span class="sub">' + elig + meta + '</span>'
    + slateHtml(r)
    + '</div>' + slotBadgeHtml(r.pid, r.slot) + '</div></td>'
    + '<td class="num">' + ovr + '</td>'
    + '<td class="num">' + avg + '</td>'
    + '<td class="num">' + smash + '</td>'
    + '<td class="' + bankCls + '" title="' + escapeHtml(bankTitle) + '">' + bank + '</td>'
    + '<td class="rec ' + escapeHtml(rec.cls) + '" title="' + escapeHtml(rec.reason || '') + '">'
    + '<span class="rec-act">' + escapeHtml(rec.label) + '</span>'
    + (rec.reason ? ('<span class="rec-why">' + escapeHtml(rec.reason) + '</span>') : '')
    + '</td>'
    + '</tr>';
}

function renderSide(side, pack){
  const fr = side.franchise;
  const starters = pack.starters || [];
  const bench = pack.bench || [];
  const body = []
    .concat(starters.length ? ['<tr class="section-row"><td colspan="6">Starters</td></tr>'] : [])
    .concat(starters.map(playerRowHtml))
    .concat(bench.length ? ['<tr class="section-row"><td colspan="6">Bench</td></tr>'] : [])
    .concat(bench.map(playerRowHtml))
    .join('');

  const lockedN = pack.lockedScores.length;
  const slots = lockSlotLabels().length;
  return '<div class="side" style="--team-color:' + escapeHtml(fr.color) + '">'
    + '<div class="side-head"><h3>' + escapeHtml(fr.team) + '</h3>'
    + '<span class="pts">' + Math.round(side.points) + ' FP · '
    + lockedN + '/' + slots + ' locked</span></div>'
    + '<table><thead><tr>'
    + '<th>Player</th><th class="num">Lock</th><th class="num">Avg</th><th class="num">Smash</th>'
    + '<th class="num">Bank ≥</th><th>Rec</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

    + 'Bank ≥ rises midweek / with games left / when questionable, and eases on last-game weekends. '
    + 'Rec says Lock (slot), Switch out / In · over starter (slot-eligible only), or Wait. '
    + 'Bench Switch only when they should come in over a starter. '
    + 'OCR only matches this matchup’s two rosters.';

  document.querySelectorAll('[data-lock-pid]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();

        : (slotRaw === 'BN' ? 'BN' : Number(slotRaw));

    sel.addEventListener('change', () => {

      setPlayerSlot(pid, slot);
    });
  });
}

/* ——— Screenshot OCR (Sleeper matchup) ——— */
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (state.tesseractLoading) return state.tesseractLoading;
  const urls = [
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
  ];
  state.tesseractLoading = (async () => {
    let lastErr = null;
    for (let i = 0; i < urls.length; i++){
      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = urls[i];
          s.async = true;
          s.onload = () => window.Tesseract ? resolve() : reject(new Error('Tesseract missing'));
          s.onerror = () => reject(new Error('CDN fail ' + urls[i]));
          document.head.appendChild(s);
        });
        return window.Tesseract;
      } catch (e){ lastErr = e; }
    }
    state.tesseractLoading = null;
    throw lastErr || new Error('Could not load OCR library');
  })();
  return state.tesseractLoading;
}

/* Color canvas of the left roster column — used for green vs cyan lock badges. */
function prepColorCanvas(img, opts){
  const options = opts || {};
  const leftOnly = options.leftOnly !== false;
  let sw = img.naturalWidth || img.width;
  let sh = img.naturalHeight || img.height;
  const srcW = leftOnly ? Math.max(1, Math.floor(sw * 0.55)) : sw;
  /* Cap tall Sleeper scrolls so badge scan stays responsive. */
  const maxH = options.maxH || 14000;
  const maxW = options.maxW || 900;
  const scale = Math.min(1, maxW / srcW, maxH / sh);
  const w = Math.max(1, Math.round(srcW * scale));
  const h = Math.max(1, Math.round(sh * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(img, 0, 0, srcW, sh, 0, 0, w, h);
  return {canvas, scale, srcW, sh};
}

/* Soft invert for dark Sleeper UI — name OCR only (not badge color). */
function prepCanvasForOcr(img, opts){
  const options = opts || {};
  const maxSide = options.maxSide || 2400;
  const leftOnly = !!options.leftOnly;
  let sw = img.naturalWidth || img.width;
  let sh = img.naturalHeight || img.height;
  const srcW = leftOnly ? Math.max(1, Math.floor(sw * 0.55)) : sw;
  const scale = Math.min(1, maxSide / Math.max(srcW, sh));
  const minW = leftOnly ? 900 : 1100;
  const boost = srcW * scale < minW ? (minW / srcW) : scale;
  const w = Math.max(1, Math.round(srcW * boost));
  const h = Math.max(1, Math.round(sh * boost));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, srcW, sh, 0, 0, w, h);
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;
  let sum = 0, step = 20;
  for (let i = 0; i < d.length; i += 4 * step) sum += (d[i] + d[i+1] + d[i+2]) / 3;
  const avg = sum / Math.max(1, Math.floor(d.length / (4 * step)));
  if (avg < 120){
    const contrast = 1.35;
    for (let i = 0; i < d.length; i += 4){
      let r = 255 - d[i], g = 255 - d[i+1], b = 255 - d[i+2];
      r = Math.min(255, Math.max(0, (r - 128) * contrast + 128));
      g = Math.min(255, Math.max(0, (g - 128) * contrast + 128));
      b = Math.min(255, Math.max(0, (b - 128) * contrast + 128));
      const y = 0.299 * r + 0.587 * g + 0.114 * b;
      const v = y > 155 ? 255 : (y < 75 ? 0 : y);
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  return canvas;
}

function canvasToBlob(canvas){
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) reject(new Error('Could not prepare image'));
      else resolve(blob);
    }, 'image/png');
  });
}

function loadShotImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const color = prepColorCanvas(img, {leftOnly: true});
        const ocrLeft = prepCanvasForOcr(img, {leftOnly: true});
        URL.revokeObjectURL(url);
        resolve({img, color, ocrLeft});
      } catch (e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}

/* Only the two fantasy teams in the selected matchup — never the whole NBA pool. */
function matchupRosterPids(){
  const set = new Set();
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return set;
  pair.sides.forEach(side => {
    (side.franchise.players || []).forEach(id => set.add(String(id)));
  });
  return set;
}

function buildNameIndex(onlyPids){
  const allow = onlyPids || null;
  const idx = [];
  const pids = allow ? Array.from(allow) : Object.keys(state.players);
  pids.forEach(pid => {
    const id = String(pid);
    if (allow && !allow.has(id)) return;
    const p = state.players[id];
    if (!p || id.indexOf('TEAM_') === 0) return;
    const name = playerName(p);
    const key = normalizeName(name);
    if (key.length < 4) return;
    const last = normalizeName(p.last_name || name.split(' ').slice(-1)[0]);
    const first = normalizeName(p.first_name || name.split(' ')[0] || '');
    const abbr = first ? (first.charAt(0) + last) : '';
    idx.push({pid: id, name, key, last, abbr});
  });
  return idx;
}

function editDist(a, b){
  const s = String(a || ''), t = String(b || '');
  if (s === t) return 0;
  if (!s.length) return t.length;
  if (!t.length) return s.length;
  const row = Array.from({length: t.length + 1}, (_, i) => i);
  for (let i = 0; i < s.length; i++){
    let prev = i, next = i + 1;
    for (let j = 0; j < t.length; j++){
      const cur = s.charAt(i) === t.charAt(j) ? prev : Math.min(prev, row[j + 1], next) + 1;
      prev = row[j + 1];
      row[j + 1] = cur;
      next = cur;
    }
  }
  return row[t.length];
}

function softNorm(s){
  /* Keep spaces so “K Wagler” stays tokenizable after OCR cleanup. */
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\.…\u2019']/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
}

function matchPlayerOnLine(lnOrRaw, idx){
  const ln = normalizeName(lnOrRaw);
  const soft = softNorm(lnOrRaw);
  /* Strip ellipsis from Sleeper truncations: “Antetokou...” */
  const words = soft.split(/\s+/).map(w => w.replace(/\.+$/g, '')).filter(w => w.length >= 3);
  let best = null, bestScore = 99;
  idx.forEach(f => {
    let score = 99;
    if (ln.indexOf(f.key) >= 0) score = 0;
    else if (f.abbr && f.abbr.length >= 4 && ln.indexOf(f.abbr) >= 0) score = 1;
    else if (f.last.length >= 4 && ln.indexOf(f.last) >= 0) score = 2;
    else if (f.last.length >= 4){
      words.forEach(w => {
        /* Long Sleeper names often truncate mid-lastname. */
        if (w.length >= 5 && f.last.length >= 6){
          if (f.last.indexOf(w) === 0 || w.indexOf(f.last) === 0){
            score = Math.min(score, 2);
            return;
          }
        }
        if (Math.abs(w.length - f.last.length) > 2) return;
        const d = editDist(w, f.last);
        if (d <= 2) score = Math.min(score, 3 + d);
      });
    }
    if (score < bestScore){ bestScore = score; best = f; }
  });
  return bestScore <= 5 ? best : null;
}

function focusRosterPids(){
  /* Prefer the focused franchise when both sides are in the pool. */
  const set = new Set();
  const pair = state.selectedPair || state.pairs[0];
  if (!pair) return set;
  const side = pair.sides.find(s => s.franchise.team === state.focusTeam) || pair.sides[0];
  (side && side.franchise.players || []).forEach(id => set.add(String(id)));
  return set;
}

function ptsForMatchedPlayer(pid){
  const pair = state.selectedPair || state.pairs[0];
  const side = pair && pair.sides.find(s => (s.franchise.players || []).map(String).includes(String(pid)));
  return weekPtsFor(pid, side && side.matchup);
}

/* Sleeper lock states (from matchup SC):
   1) LOCKED — scored night’s team logo with cyan ring + small closed lock (no LOCK-IN button)
   2) Eligible unlocked — large solid cyan open-lock button labeled “LOCK-IN”
   3) Can’t lock — grey slash + “NOT LOCK”
   Never treat LOCK-IN text/button as locked. */
function rgbToHsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return {h, s: max ? d / max : 0, v: max};
}

function isCyanLockPixel(r, g, b){
  const {h, s, v} = rgbToHsv(r, g, b);
  return v >= 0.35 && s >= 0.4 && h >= 155 && h <= 205 && g > r + 15 && b > r + 15;
}

function findSleeperLockMarks(canvas){
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  const w = canvas.width, h = canvas.height;
  const {data} = ctx.getImageData(0, 0, w, h);
  const visited = new Uint8Array(w * h);
  const locked = [];
  const lockInBtns = [];
  /* Stay on the left roster column; ignore far-right noise. */
  const xMax = Math.min(w - 2, Math.floor(w * 0.72));

  for (let y = 40; y < h - 20; y++){
    for (let x = 16; x < xMax; x++){
      const p = y * w + x;
      if (visited[p]) continue;
      const i = p * 4;
      if (!isCyanLockPixel(data[i], data[i + 1], data[i + 2])) continue;
      const stack = [[x, y]];
      visited[p] = 1;
      let minx = x, maxx = x, miny = y, maxy = y, n = 0;
      while (stack.length){
        const cur = stack.pop();
        const cx = cur[0], cy = cur[1];
        n++;
        const nbrs = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
        for (let k = 0; k < nbrs.length; k++){
          const nx = nbrs[k][0], ny = nbrs[k][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const np = ny * w + nx;
          if (visited[np]) continue;
          const j = np * 4;
          if (!isCyanLockPixel(data[j], data[j + 1], data[j + 2])) continue;
          visited[np] = 1;
          stack.push([nx, ny]);
          if (nx < minx) minx = nx;
          if (nx > maxx) maxx = nx;
          if (ny < miny) miny = ny;
          if (ny > maxy) maxy = ny;
        }
      }
      const bw = maxx - minx + 1, bh = maxy - miny + 1;
      if (n < 200 || bw < 70 || bh < 70) continue;
      const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
      const rad = Math.min(bw, bh) / 2;
      let inner = 0, innerCyan = 0, ring = 0, ringCyan = 0;
      for (let yy = miny; yy <= maxy; yy++){
        for (let xx = minx; xx <= maxx; xx++){
          const dist = Math.hypot(xx - cx, yy - cy);
          if (dist > rad) continue;
          const j = (yy * w + xx) * 4;
          const cyan = isCyanLockPixel(data[j], data[j + 1], data[j + 2]);
          if (dist <= rad * 0.55){
            inner++;
            if (cyan) innerCyan++;
          } else {
            ring++;
            if (cyan) ringCyan++;
          }
        }
      }
      const fill = n / (bw * bh);
      const innerFill = inner ? innerCyan / inner : 0;
      const ringFill = ring ? ringCyan / ring : 0;
      const mark = {x: cx, y: cy, bw, bh, n, fill, innerFill, ringFill};
      /* Solid LOCK-IN button: dense cyan including the interior. */
      if (fill >= 0.4 || (innerFill >= 0.25 && ringFill >= 0.5) || n >= 5000){
        lockInBtns.push(mark);
        continue;
      }
      /* Locked night: cyan ring around a team logo (hollow interior). */
      if (fill <= 0.28 && ringFill >= 0.15 && innerFill <= 0.22){
        locked.push(mark);
      }
    }
  }
  locked.sort((a, b) => a.y - b.y);
  lockInBtns.sort((a, b) => a.y - b.y);
  return {locked, lockInBtns};
}

function matchLockedLogosToPlayers(lockedMarks, lockInBtns, ocrWords){
  const rosterPids = matchupRosterPids();
  const focusPids = focusRosterPids();
  const focusIdx = buildNameIndex(focusPids.size ? focusPids : rosterPids);
  const bothIdx = buildNameIndex(rosterPids);
  const hits = [];
  const seen = {};
  const words = (ocrWords || []).filter(w =>
    w && w.confidence >= 35 && /[A-Za-z]{2,}/.test(String(w.text || ''))
  ).map(w => ({
    t: String(w.text || ''),
    y: w.bbox ? w.bbox.y0 : 0,
    y1: w.bbox ? w.bbox.y1 : 0,
    x: w.bbox ? w.bbox.x0 : 0
  }));

  const lockInYs = (lockInBtns || []).map(b => b.y);
  words.forEach(w => {
    const n = normalizeName(w.t);
    if (n.indexOf('lockin') >= 0 || n === 'lockin') lockInYs.push(w.y);
  });

  function nearLockIn(y){
    return lockInYs.some(ly => Math.abs(ly - y) < 160);
  }

  (lockedMarks || []).forEach(b => {
    if (nearLockIn(b.y)) return; /* LOCK-IN button row, not a banked logo. */
    const above = words
      .filter(n => n.y < b.y && b.y - n.y < 380 && b.y - n.y > 8)
      .sort((a, c) => c.y - a.y)
      .slice(0, 14);
    const nearText = above.slice(0, 8).map(n => n.t).join(' ');
    if (/not\s*lock/i.test(nearText) || normalizeName(nearText).indexOf('notlock') >= 0) return;
    let match = matchPlayerOnLine(nearText, focusIdx);
    if (!match) match = matchPlayerOnLine(nearText, bothIdx);
    if (!match || !rosterPids.has(String(match.pid)) || seen[match.pid]) return;

    const side = sideForPid(match.pid);
    const slot = slotKeyForPidOnSide(side, match.pid);
    let pts = ptsForMatchedPlayer(match.pid);
    if (pts == null || !Number.isFinite(pts)){
      const nums = nearText.match(/\b(\d{1,3}(?:\.\d{1,2})?)\b/g) || [];
      const ptsCand = nums.map(Number).filter(n => n >= 5 && n <= 90);
      if (ptsCand.length) pts = ptsCand[ptsCand.length - 1];
    }
    if (pts == null || !Number.isFinite(pts)) return;
    seen[match.pid] = 1;
    hits.push({
      pid: match.pid,
      name: match.name,
      pts: Number(pts),
      slot,
      slotLabel: slotDisplayLabel(slot)
    });
  });
  return hits;
}

async function ocrWordsFromCanvas(worker, canvas, psm){
  await worker.setParameters({tessedit_pageseg_mode: String(psm)});
  const blob = await canvasToBlob(canvas);
  const {data} = await worker.recognize(blob);
  return data;
}

async function runOcrOnImage(file){
  const status = document.getElementById('shotStatus');
  const preview = document.getElementById('shotPreview');
  status.className = 'shot-status';
  status.textContent = 'Reading screenshot for locked logo nights…';
  preview.hidden = false;
  preview.src = URL.createObjectURL(file);
  try {
    await loadTesseract();
    const packs = await loadShotImage(file);
    status.textContent = 'Scanning logo-locks vs LOCK-IN buttons…';
    const marks = findSleeperLockMarks(packs.color.canvas);

    const worker = await Tesseract.createWorker('eng');
    let words = [];
    let textSample = '';
    try {
      status.textContent = 'Matching locked nights to roster names…';
      const pass1 = await ocrWordsFromCanvas(worker, packs.ocrLeft, 6);
      words = pass1.words || [];
      textSample = pass1.text || '';
      if (!words.length){
        const pass2 = await ocrWordsFromCanvas(worker, packs.ocrLeft, 4);
        words = pass2.words || [];
        textSample = (textSample + '\n' + (pass2.text || '')).trim();
      }
    } finally {
      await worker.terminate();
    }

    const ocrH = packs.ocrLeft.height || 1;
    const colorH = packs.color.canvas.height || 1;
    const yScale = colorH / ocrH;
    const xScale = packs.color.canvas.width / (packs.ocrLeft.width || 1);
    const scaledWords = words.map(w => ({
      text: w.text,
      confidence: w.confidence,
      bbox: w.bbox ? {
        x0: w.bbox.x0 * xScale,
        y0: w.bbox.y0 * yScale,
        x1: w.bbox.x1 * xScale,
        y1: w.bbox.y1 * yScale
      } : null
    }));

    Object.keys(state.lockMarks || {}).forEach(pid => {
      if (state.lockMarks[pid] && state.lockMarks[pid].source === 'ocr'){
        delete state.lockMarks[pid];
      }
    });
    const hits = matchLockedLogosToPlayers(marks.locked, marks.lockInBtns, scaledWords);
    hits.forEach(h => {
      state.lockMarks[h.pid] = {
        pts: h.pts,
        source: 'ocr',
        name: h.name,
        slot: h.slot == null ? 'BN' : h.slot
      };
    });
    saveLockMarks();
    document.getElementById('shotClear').hidden = false;
    const rosterN = matchupRosterPids().size;
    if (!hits.length){
      status.className = 'shot-status';
      status.textContent = marks.locked.length
        ? ('Found ' + marks.locked.length + ' logo-lock(s) but none matched the '
          + rosterN + ' rostered players in this matchup. Tap lock pills if needed.')
        : ('No locked logo nights in that shot'
          + (marks.lockInBtns.length ? (' (' + marks.lockInBtns.length + ' LOCK-IN button(s) = still unlocked)') : '')
          + '). Matched only against this matchup’s rosters.');
      console.warn('matchup locks', marks, 'roster pool', rosterN, 'ocr sample', textSample.slice(0, 600));
      render();
    } else {
      status.className = 'shot-status ok';
      status.textContent = 'LOCKED from screenshot: '
        + hits.map(h => h.name + ' @' + (h.slotLabel || slotDisplayLabel(h.slot)) + ' ' + h.pts).join(', ')
        + (marks.lockInBtns.length ? (' · ignored ' + marks.lockInBtns.length + ' LOCK-IN button(s)') : '');
      render();
    }
  } catch (e){
    status.className = 'shot-status err';
    status.textContent = 'OCR failed: ' + (e.message || e)
      + '. You can still tap lock pills on each starter.';
  }
}

function bindShotUi(){
  const file = document.getElementById('shotFile');
  document.getElementById('shotPick').addEventListener('click', () => file.click());
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if (f) runOcrOnImage(f);
  });
  document.getElementById('shotPaste').addEventListener('click', async () => {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items){
        const type = item.types.find(t => t.startsWith('image/'));
        if (!type) continue;
        const blob = await item.getType(type);
        await runOcrOnImage(new File([blob], 'paste.png', {type}));
        return;
      }
      document.getElementById('shotStatus').textContent = 'No image on clipboard.';
    } catch (e){
      document.getElementById('shotStatus').textContent = 'Clipboard paste blocked — use Choose image.';
    }
  });
  document.getElementById('shotClear').addEventListener('click', () => {
    state.lockMarks = {};
    saveLockMarks();
    document.getElementById('shotPreview').hidden = true;
    document.getElementById('shotClear').hidden = true;
    document.getElementById('shotStatus').className = 'shot-status';
    document.getElementById('shotStatus').textContent = 'Lock marks cleared for this week.';
    render();
  });
}
